<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/icon.png" sizes="any">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/icon.png">
<title>iRC · пит-стопы</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --surface:rgba(20,25,35,.92); --surface-2:rgba(27,34,48,.92);
    --line:rgba(58,68,86,.5); --fg:#EAEEF5; --dim:#9AA6B8; --light:#6B7689;
    --accent:#FF5A1F; --pit:#38BDF8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font:13px/1.2 'Inter',system-ui,sans-serif;color:var(--fg);padding:10px;width:400px}
  .box{border-radius:10px;overflow:hidden;box-shadow:0 10px 34px -14px rgba(0,0,0,.75)}
  .head{display:flex;gap:8px;padding:7px 11px;background:var(--accent);color:#fff;
        font-family:'Rubik',sans-serif;font-weight:700;font-size:11.5px;
        letter-spacing:.6px;text-transform:uppercase}
  .row{display:grid;grid-template-columns:24px 32px 1fr 40px 56px;gap:8px;align-items:center;
       padding:5px 11px;background:var(--surface);border-top:1px solid var(--line)}
  .row:nth-child(even){background:var(--surface-2)}
  .row.inpit{background:rgba(56,189,248,.16)}
  .pos{font-family:'Rubik',sans-serif;font-weight:700;text-align:center;color:var(--dim);font-size:12px}
  .num{font-family:'Rubik',sans-serif;font-weight:700;font-size:11px;text-align:center;
       padding:2px 0;border-radius:4px;background:rgba(255,255,255,.09)}
  .name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
  .cnt{text-align:center;font-family:'Rubik',sans-serif;font-weight:700;font-size:13px}
  .dur{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim)}
  .th{display:grid;grid-template-columns:24px 32px 1fr 40px 56px;gap:8px;padding:4px 11px;
      background:var(--surface);color:var(--light);font-size:9.5px;text-transform:uppercase;
      letter-spacing:.5px;border-top:1px solid var(--line)}
  .th div:nth-child(4){text-align:center}
  .th div:nth-child(5){text-align:right}
  .foot{padding:5px 11px;background:var(--surface);border-top:1px solid var(--line);
        color:var(--light);font-size:10px}
  .off{padding:14px;background:var(--surface);border-radius:10px;color:var(--dim);
       text-align:center;font-size:12px}
</style>
</head>
<body>
<div id="root"><div class="off">пит-стопов пока не было</div></div>
<script>
async function pull(){
  try{
    const d = await (await fetch('/api/broadcast/pits')).json();
    if(d.visible === false){            // режиссёр убрал графику из эфира
      document.getElementById('root').innerHTML = '';
      return;
    }
    const root = document.getElementById('root');
    if(!d.rows || !d.rows.length){
      root.innerHTML = '<div class="off">пит-стопов пока не было</div>';
      return;
    }
    const rows = d.rows.map(r => `
      <div class="row ${r.in_pit ? 'inpit' : ''}">
        <div class="pos">${r.position}</div>
        <div class="num">${r.car_number}</div>
        <div class="name">${r.name}</div>
        <div class="cnt">${r.count}</div>
        <div class="dur">${r.last ? r.last.duration.toFixed(1)+'с' : '—'}</div>
      </div>`).join('');
    root.innerHTML = `<div class="box">
      <div class="head">${d.title}</div>
      <div class="th"><div></div><div>№</div><div>пилот</div><div>стопов</div><div>последний</div></div>
      ${rows}
      <div class="foot">резина: определяется по компаунду, смена в пределах
        одного типа симом не отдаётся</div>
    </div>`;
  }catch(e){}
}
pull(); setInterval(pull, 1000);
</script>
</body>
</html>
