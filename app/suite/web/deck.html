<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/icon.png" sizes="any">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="mobile-web-app-capable" content="yes">
<title>iRC · пульт</title>
<style>
  /* Один пульт на два случая: окно поверх iRacing и телефон в той же сети.
     Шрифт цифр — Bahnschrift, как у эфирной графики: пульт должен читаться
     так же, как то, что уходит в эфир. */
  :root{
    --bg:#0B0E14; --surface:#141923; --surface-2:#1A2130; --surface-3:#232C3D;
    --line:#28303F; --fg:#EAEEF5; --dim:#9AA6B8; --light:#6B7689;
    --accent:#FF5A1F; --live:#22C55E; --warn:#F0A020;
    --num:'Bahnschrift SemiBold Condensed','Bahnschrift','Arial Narrow',system-ui,sans-serif;
    --ui:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--fg)}
  body{font:14px/1.35 var(--ui);padding:10px 12px calc(env(safe-area-inset-bottom) + 16px)}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

  header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  header.top img{height:22px}
  .pill{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;
        letter-spacing:.5px;text-transform:uppercase}
  .pill.LIVE{background:rgba(34,197,94,.14);color:var(--live)}
  .pill.REPLAY{background:rgba(245,158,11,.14);color:#F59E0B}
  .pill.OFFLINE{background:rgba(107,118,137,.14);color:var(--light)}
  .pill.demo{background:#3A2A12;color:#FFB86B}
  .hmeta{margin-left:auto;color:var(--light);font-size:12px;white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis}

  section{margin-bottom:12px}
  h2{font:600 11px/1 var(--ui);letter-spacing:.8px;text-transform:uppercase;
     color:var(--dim);margin:0 0 7px}
  h2 small{text-transform:none;letter-spacing:0;color:var(--light);font-weight:400}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .note{color:var(--light);font-size:12px}

  /* вывод */
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;
        padding:9px 12px;font-weight:600;display:flex;align-items:center;gap:8px;
        transition:background .12s,border-color .12s}
  .chip:hover{background:var(--surface-2)}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--light)}
  .chip.on{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.09)}
  .chip.on .dot{background:var(--live);box-shadow:0 0 8px rgba(34,197,94,.7)}
  .chip.ghost{color:var(--dim)}

  /* камеры */
  .cam{background:var(--surface);border:1px solid var(--line);border-radius:9px;
       padding:7px 11px;font-weight:600;font-size:13px}
  .cam:hover{background:var(--surface-2)}
  .cam.on{border-color:var(--accent);color:#fff;background:rgba(255,90,31,.14)}
  .camnow{color:var(--dim);font-size:12px;margin-left:6px}
  .camnow b{color:var(--fg);font:600 15px/1 var(--num)}

  /* макросы */
  .macro{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
         padding:9px 13px;font-weight:600}
  .macro:hover{border-color:var(--light)}
  .macro.run{border-color:var(--accent);color:#fff;background:rgba(255,90,31,.16)}
  .macro.edit{color:var(--dim);border-style:dashed}

  /* таблица пилотов: на 40 машин карточки не читаются, нужна строка на
     пилота — глаз идёт по колонке, а не прыгает по плиткам */
  .thead{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .thead h2{margin:0}
  #q{width:260px;padding:6px 10px}
  .tblwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;
           max-height:calc(100vh - 250px);min-height:180px}
  table.tt{width:100%;border-collapse:collapse;font-size:13px}
  .tt th{position:sticky;top:0;z-index:1;background:var(--surface-2);color:var(--dim);
         font:600 10.5px/1 var(--ui);letter-spacing:.6px;text-transform:uppercase;
         text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tt th.l,.tt td.l{text-align:left}
  .tt th.c,.tt td.c{text-align:center}
  .tt td{padding:3px 8px;height:30px;border-bottom:1px solid rgba(40,48,63,.55);
         text-align:right;white-space:nowrap;font-family:var(--num);font-size:14px}
  .tt tbody tr{cursor:pointer}
  .tt tbody tr:nth-child(even){background:rgba(26,33,48,.45)}
  .tt tbody tr:hover{background:var(--surface-3)}
  .tt tr.focus{background:rgba(255,90,31,.13) !important;box-shadow:inset 3px 0 0 var(--accent)}
  .tt .pos{font-size:17px;color:#fff;width:34px}
  .tt .num{display:inline-block;font:600 13px/1 var(--num);color:#0B0E14;padding:4px 8px 3px 9px;
           min-width:36px;text-align:center;clip-path:polygon(16% 0,100% 0,84% 100%,0 100%)}
  .tt .nm{font-size:15px;letter-spacing:.3px;color:#fff}
  .tt .tm{font-family:var(--ui);font-size:12px;color:var(--light);max-width:190px;
          overflow:hidden;text-overflow:ellipsis}
  .tt .int{color:#fff}
  .tt .ldr{color:#FF8A4C}
  .tt .dim{color:var(--dim)}
  .sec{display:inline-block;min-width:62px;border-radius:5px;padding:3px 6px 2px;
       text-align:center;color:var(--light);background:var(--surface-3)}
  .sec.p{background:rgba(178,107,255,.22);color:#DCC0FF}    /* лучший по полю */
  .sec.g{background:rgba(46,160,67,.22);color:#86E3A6}      /* личный лучший */
  .sec.y{background:rgba(227,179,65,.16);color:#F2D38A}     /* медленнее */
  .sec.old{opacity:.45}                                     /* прошлый круг */
  .inc{color:var(--dim)}
  .inc.hot{color:#FF8B87}
  .badge{display:inline-block;font:700 10px/1 var(--ui);letter-spacing:.5px;padding:3px 6px;
         border-radius:4px;margin-left:6px;vertical-align:1px}
  .badge.cam{background:var(--accent);color:#fff}
  .badge.pit{background:var(--warn);color:#1b1305}
  .empty{color:var(--light);padding:18px;text-align:center}
  mark{background:rgba(255,90,31,.35);color:#fff;border-radius:2px}

  /* редактор макросов */
  .modal{position:fixed;inset:0;background:rgba(5,7,11,.74);display:flex;
         align-items:center;justify-content:center;padding:14px;z-index:5}
  /* display:flex выше перебивает атрибут hidden — без этой строки пустая
     подложка редактора лежала поверх всего пульта и глотала клики */
  .modal[hidden]{display:none}
  .dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;
       width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .dlg .dh{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
  .dlg .body{display:grid;grid-template-columns:220px 1fr;min-height:0;flex:1}
  .list{border-right:1px solid var(--line);overflow:auto;padding:8px}
  .list .it{padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--dim)}
  .list .it:hover{color:#fff}
  .list .it.on{background:var(--surface-3);color:#fff}
  .list .it.add{color:var(--accent)}
  .ed{padding:12px 14px;overflow:auto}
  .ed label{display:block;color:var(--dim);font-size:12px;margin:0 0 5px}
  input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;
               color:var(--fg);padding:7px 9px;font:inherit}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .step{display:flex;gap:6px;align-items:center;background:var(--surface-2);
        border:1px solid var(--line);border-radius:10px;padding:7px;margin-bottom:6px;flex-wrap:wrap}
  .step .n{font:600 14px/1 var(--num);color:var(--light);width:18px;text-align:center}
  .step select,.step input{padding:6px 8px}
  .grow{flex:1}
  .ib{border:1px solid var(--line);border-radius:7px;padding:5px 8px;color:var(--dim)}
  .ib:hover{color:#fff;border-color:var(--light)}
  .dlg .df{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .btn{background:var(--surface-3);border:1px solid var(--line);border-radius:9px;
       padding:8px 14px;font-weight:600}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.dng{color:#FF8B87}

  #toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,170%);
         background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);
         border-radius:10px;padding:10px 14px;font-size:13px;transition:transform .2s;z-index:9}
  #toast.on{transform:translate(-50%,0)}

  @media (max-width:640px){
    .dlg .body{grid-template-columns:1fr}
    .list{border-right:0;border-bottom:1px solid var(--line);max-height:150px}
    /* на телефоне прокручивается страница, а таблица — только вбок */
    .tblwrap{max-height:none}
    #q{flex:1;width:auto}
    .tt .col-team,.tt .col-best{display:none}
  }
</style>
</head>
<body>
<header class="top">
  <img src="/assets/logo.png" alt="iRC">
  <span class="pill OFFLINE" id="mode">offline</span>
  <span class="pill demo" id="demo" hidden>ДЕМО</span>
  <span class="hmeta" id="hmeta"></span>
</header>

<section>
  <h2>Вывод</h2>
  <div class="row" id="overlays"></div>
</section>

<section>
  <h2>Камера</h2>
  <div class="row" id="cams"></div>
</section>

<section>
  <h2>Макросы</h2>
  <div class="row" id="macros"></div>
</section>

<section>
  <div class="thead">
    <h2>Пилоты</h2>
    <input id="q" type="search" autocomplete="off"
           placeholder="№ или фамилия">
    <span class="note" id="qinfo">клик по строке — камера на пилота · «/» — к поиску</span>
  </div>
  <div class="tblwrap">
    <table class="tt">
      <thead id="thead"></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>

<div class="modal" id="modal" hidden></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// цвета классов — те же, что у чипов в эфирной графике (style.py)
const CLASS = {GT3:'#FF5A1F', PRO:'#FF5A1F', GT4:'#3B82F6', AM:'#3B82F6',
               SILVER:'#94A3B8', GOLD:'#E3B341'};
const clsColor = c => CLASS[String(c || '').toUpperCase()] || '#5A6B85';

const S = {overlays: [], cams: {groups: [], current: {}}, cards: null,
           macros: [], running: null, bcOn: true, hold: 0};

let toastTimer;
function toast(text){
  const t = $('#toast');
  t.textContent = text; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}

async function api(url, body){
  const opt = body !== undefined
    ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}
    : {};
  const r = await fetch(url, opt);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

// ---------- форматирование ----------

function surname(n){
  const p = String(n || '').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '';
  let t = p[p.length - 1];
  if(t.length <= 2 && p.length > 1) t = p[0];          // инициал в конце
  return t.toUpperCase();
}
function fmtT(t, d = 3){
  if(t == null || t <= 0) return '—';
  if(t >= 60){
    const m = Math.floor(t / 60);
    return `${m}:${(t - m * 60).toFixed(d).padStart(d + 3, '0')}`;
  }
  return t.toFixed(d);
}
const fmtGap = g => g == null ? '' : '+' + g.toFixed(1);

// ---------- вывод ----------

function renderOverlays(){
  const box = $('#overlays');
  if(!S.bcOn){
    box.innerHTML = '<span class="note">Модуль «Оверлеи трансляции» выключен — включи его в панели iRC.</span>';
    return;
  }
  box.innerHTML = S.overlays.map(o =>
    `<button class="chip ${o.visible ? 'on' : ''}" data-ov="${o.id}">
       <span class="dot"></span>${esc(o.title)}</button>`).join('')
    + '<button class="chip ghost" data-ov="*">Убрать всё</button>';
}

// ---------- камеры ----------

function renderCams(){
  const cur = S.cams.current || {};
  const groups = S.cams.groups || [];
  if(!groups.length){
    $('#cams').innerHTML = '<span class="note">Группы камер появятся, когда сим подключится.</span>';
    return;
  }
  const now = cur.car_number
    ? `<span class="camnow">в кадре <b>#${esc(cur.car_number)}</b> · ${esc(cur.group_name || '')}</span>`
    : '';
  $('#cams').innerHTML = groups.map(g =>
    `<button class="cam ${g.num === cur.group ? 'on' : ''}" data-group="${g.num}">${esc(g.name)}</button>`
  ).join('') + now;
}

// ---------- макросы ----------

function renderMacros(){
  $('#macros').innerHTML = S.macros.map(m =>
    `<button class="macro ${S.running === m.id ? 'run' : ''}" data-macro="${esc(m.id)}">${esc(m.title)}</button>`
  ).join('') + '<button class="macro edit" data-editor="1">Редактор макросов</button>';
}

// ---------- таблица пилотов ----------

function secClass(t, i, best, overall){
  if(t == null) return '';
  if(overall[i] != null && t <= overall[i] + 0.0005) return 'p';
  if(best[i] != null && t <= best[i] + 0.0005) return 'g';
  return 'y';
}

// Поиск: номер ищем с начала («1» даёт 1, 12, 14), фамилию и команду —
// вхождением в любом регистре.
function matches(r, q){
  if(!q) return true;
  const qn = q.replace(/^#/, '');
  if(/^\d+$/.test(qn)) return String(r.car_number).startsWith(qn);
  return (r.name + ' ' + (r.team || '')).toLowerCase().includes(q.toLowerCase());
}
function hl(text, q){
  if(!q || /^#?\d+$/.test(q)) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>'
       + esc(text.slice(i + q.length));
}

let headSig = '';
function renderHead(n){
  if(headSig === 'n' + n) return;
  headSig = 'n' + n;
  let secs = '';
  for(let i = 0; i < n; i++) secs += `<th class="c">S${i + 1}</th>`;
  if(!n) secs = '<th class="c">Сектора</th>';
  $('#thead').innerHTML = `<tr><th>Поз</th><th class="c">№</th><th class="l">Пилот</th>
    <th class="l col-team">Команда</th><th>Интервал</th><th>К лидеру</th>${secs}
    <th>Посл.</th><th class="col-best">Лучший</th><th>Инц</th><th class="c">Пит</th></tr>`;
}

function visibleRows(){
  const d = S.cards;
  if(!d || !d.rows) return [];
  const q = $('#q').value.trim();
  return d.rows.filter(r => matches(r, q));
}

function renderCards(){
  // Пока палец или мышь на строке — не перерисовываем: иначе строка
  // подменится между нажатием и отпусканием, и клик потеряется.
  if(Date.now() - S.hold < 450) return;
  const d = S.cards, body = $('#rows');
  const n = (d && d.sectors_n) || 0;
  renderHead(n);
  const cols = 10 + Math.max(1, n);
  if(!d || !d.rows || !d.rows.length){
    body.innerHTML = `<tr><td colspan="${cols}" class="empty">Пилотов нет: сим не подключён. Для проверки включи «Демо-данные» в панели iRC.</td></tr>`;
    $('#qinfo').textContent = '';
    return;
  }
  const q = $('#q').value.trim();
  const rows = visibleRows();
  $('#qinfo').textContent = q
    ? `найдено ${rows.length} из ${d.rows.length}`
    : `${d.rows.length} пилотов · камера: клик по строке или Enter в поиске · «/» — к поиску`;
  if(!rows.length){
    body.innerHTML = `<tr><td colspan="${cols}" class="empty">Никого по запросу «${esc(q)}»</td></tr>`;
    return;
  }
  const overall = d.best || [];
  body.innerHTML = rows.map(r => {
    const s = r.sectors || {current: [], last: [], best: []};
    let secs = '';
    for(let i = 0; i < n; i++){
      let t = (s.current || [])[i], old = false;
      if(t == null){ t = (s.last || [])[i]; old = t != null; }
      secs += `<td class="c"><span class="sec ${secClass(t, i, s.best || [], overall)} ${old ? 'old' : ''}">${
        t == null ? '—' : fmtT(t)}</span></td>`;
    }
    if(!n) secs = `<td class="c dim">${d.live ? 'нет разметки' : 'только live'}</td>`;
    const focus = r.car_idx === d.focus_car_idx;
    const leader = r.position === 1;
    const inc = r.incidents;
    return `<tr data-car="${esc(r.car_number)}" class="${focus ? 'focus' : ''}">
      <td class="pos">${r.position}</td>
      <td class="c"><span class="num" style="background:${clsColor(r.class_name)}">${esc(r.car_number)}</span></td>
      <td class="l"><span class="nm">${hl(surname(r.name), q)}</span>${focus ? '<span class="badge cam">В КАДРЕ</span>' : ''}</td>
      <td class="l col-team"><div class="tm">${hl(r.team || r.class_name || '', q)}</div></td>
      <td class="${leader ? 'ldr' : 'int'}">${leader ? 'ЛИДЕР' : fmtGap(r.interval)}</td>
      <td class="dim">${leader ? '' : fmtGap(r.gap)}</td>
      ${secs}
      <td>${fmtT(r.last_lap)}</td>
      <td class="dim col-best">${fmtT(r.best_lap)}</td>
      <td class="inc ${inc >= 8 ? 'hot' : ''}">${inc == null ? '—' : inc + 'x'}</td>
      <td class="c">${r.in_pit ? '<span class="badge pit">ПИТ</span>'
                               : (r.pit_stops ? `<span class="dim">${r.pit_stops}</span>` : '')}</td>
    </tr>`;
  }).join('');
}

// ---------- опрос ----------

async function pollCards(){
  try{ S.cards = await api('/api/broadcast/cards'); }catch(e){ S.cards = null; }
  renderCards();
}

async function pollState(){
  try{
    const st = await api('/api/state');
    const m = $('#mode');
    m.className = 'pill ' + st.mode; m.textContent = st.mode;
    $('#demo').hidden = !st.demo;
    $('#hmeta').textContent = st.connected
      ? `${st.track || 'сессия'} · ${st.drivers} пилотов` : 'сим не найден';
    S.bcOn = (st.modules || []).some(x => x.id === 'broadcast' && x.started);
  }catch(e){}
  if(S.bcOn){
    try{ S.overlays = (await api('/api/broadcast/visibility')).overlays || []; }catch(e){}
    try{ S.cams = await api('/api/broadcast/cameras'); }catch(e){}
  }
  renderOverlays(); renderCams();
}

async function loadMacros(){
  if(!S.bcOn) return;
  try{
    const r = await api('/api/broadcast/macros');
    S.macros = r.macros || []; S.running = r.running || null;
  }catch(e){}
  if($('#modal').hidden) renderMacros();
}

// ---------- действия ----------

document.addEventListener('pointerdown', e => {
  if(e.target.closest('tr[data-car]')) S.hold = Date.now();
});

document.addEventListener('click', async e => {
  const ov = e.target.closest('[data-ov]');
  if(ov){
    const id = ov.dataset.ov;
    if(id === '*'){
      for(const o of S.overlays) if(o.visible)
        await api('/api/broadcast/visibility', {id: o.id, visible: false});
      toast('Эфир очищен');
    }else{
      const cur = S.overlays.find(o => o.id === id);
      await api('/api/broadcast/visibility', {id, visible: !cur.visible});
      toast(`${cur.title}: ${!cur.visible ? 'в эфире' : 'убран'}`);
    }
    pollState();
    return;
  }

  const cam = e.target.closest('[data-group]');
  if(cam){
    const r = await api('/api/broadcast/camera', {group: +cam.dataset.group});
    if(r.current) S.cams.current = r.current;
    renderCams();
    if(!r.ok) toast('Камера не переключилась: сим не готов');
    return;
  }

  const row = e.target.closest('tr[data-car]');
  if(row){ await switchTo(row.dataset.car); return; }

  const mac = e.target.closest('[data-macro]');
  if(mac){
    const m = S.macros.find(x => x.id === mac.dataset.macro);
    const r = await api('/api/broadcast/macro/run', {id: mac.dataset.macro});
    if(r.ok){ S.running = m.id; renderMacros(); toast('Макрос: ' + m.title); }
    return;
  }

  if(e.target.closest('[data-editor]')){ openEditor(); return; }
});

// ---------- редактор макросов ----------

const STEP_LABEL = {camera: 'Камера', wait: 'Пауза', overlay: 'Оверлей'};
const ACTIONS = [['show', 'показать'], ['hide', 'убрать'], ['toggle', 'переключить'],
                 ['only', 'только этот']];
let E = null;                        // черновик: копия списка и выбранный макрос

function defaultStep(type){
  if(type === 'wait') return {type: 'wait', sec: 1};
  if(type === 'overlay') return {type: 'overlay', id: (S.overlays[0] || {}).id || 'tower', action: 'show'};
  return {type: 'camera', group: '', car: 'focus'};
}

function stepHtml(st, i){
  let f = '';
  if(st.type === 'camera'){
    const names = (S.cams.groups || []).map(g => g.name);
    if(st.group && !names.includes(st.group)) names.push(st.group);
    const gopt = ['<option value="">текущая группа</option>']
      .concat(names.map(g => `<option ${g === st.group ? 'selected' : ''}>${esc(g)}</option>`)).join('');
    const numMode = st.car && st.car !== 'focus' && st.car !== 'leader';
    f = `<select data-k="group">${gopt}</select>
      <select data-k="carmode">
        <option value="focus" ${!numMode && st.car !== 'leader' ? 'selected' : ''}>пилот в кадре</option>
        <option value="leader" ${st.car === 'leader' ? 'selected' : ''}>лидер</option>
        <option value="num" ${numMode ? 'selected' : ''}>номер машины</option>
      </select>
      ${numMode || st._num ? `<input data-k="car" value="${esc(numMode ? st.car : '')}" size="4" placeholder="#">` : ''}`;
  }else if(st.type === 'wait'){
    f = `<input data-k="sec" type="number" min="0.1" max="120" step="0.1" value="${st.sec ?? 1}" style="width:84px"> сек`;
  }else{
    const ov = S.overlays.map(o =>
      `<option value="${o.id}" ${o.id === st.id ? 'selected' : ''}>${esc(o.title)}</option>`).join('')
      + `<option value="*" ${st.id === '*' ? 'selected' : ''}>все оверлеи</option>`;
    const acts = ACTIONS.map(([v, t]) =>
      `<option value="${v}" ${st.action === v ? 'selected' : ''}>${t}</option>`).join('');
    f = `<select data-k="action">${acts}</select><select data-k="id">${ov}</select>`;
  }
  const types = Object.entries(STEP_LABEL).map(([v, t]) =>
    `<option value="${v}" ${st.type === v ? 'selected' : ''}>${t}</option>`).join('');
  return `<div class="step" data-i="${i}"><span class="n">${i + 1}</span>
    <select data-k="type">${types}</select>${f}<span class="grow"></span>
    <button class="ib" data-act="up" title="выше">↑</button>
    <button class="ib" data-act="down" title="ниже">↓</button>
    <button class="ib" data-act="del">убрать</button></div>`;
}

function drawEditor(){
  const m = E.list[E.sel];
  $('#modal').innerHTML = `<div class="dlg">
    <div class="dh">Макросы пульта</div>
    <div class="body">
      <div class="list">
        ${E.list.map((x, i) => `<div class="it ${i === E.sel ? 'on' : ''}" data-pick="${i}">${esc(x.title || 'без названия')}</div>`).join('')}
        <div class="it add" data-add="1">+ новый макрос</div>
      </div>
      <div class="ed">${m ? `
        <label>Название кнопки</label>
        <input id="mtitle" value="${esc(m.title)}" maxlength="40" style="width:100%;margin-bottom:14px">
        <label>Шаги — выполняются по порядку</label>
        <div>${m.steps.map(stepHtml).join('') || '<div class="note" style="margin:4px 0 10px">Шагов пока нет.</div>'}</div>
        <div class="row" style="margin-top:6px">
          <button class="btn" data-addstep="camera">+ камера</button>
          <button class="btn" data-addstep="wait">+ пауза</button>
          <button class="btn" data-addstep="overlay">+ оверлей</button>
        </div>` : '<div class="note">Выбери макрос слева или создай новый.</div>'}
      </div>
    </div>
    <div class="df">
      ${m ? '<button class="btn dng" data-mdel="1">Удалить макрос</button>' : ''}
      <span class="grow"></span>
      <button class="btn" data-mclose="1">Отмена</button>
      <button class="btn pri" data-msave="1">Сохранить</button>
    </div>
  </div>`;
}

function openEditor(){
  E = {list: JSON.parse(JSON.stringify(S.macros)), sel: S.macros.length ? 0 : -1};
  drawEditor();
  $('#modal').hidden = false;
}
function closeEditor(){ $('#modal').hidden = true; E = null; renderMacros(); }

$('#modal').addEventListener('click', async e => {
  if(e.target.id === 'modal'){ closeEditor(); return; }
  const t = e.target;
  const m = E.list[E.sel];
  if(t.dataset.pick !== undefined){ E.sel = +t.dataset.pick; drawEditor(); return; }
  if(t.dataset.add){
    E.list.push({id: '', title: 'Новый макрос', steps: []});
    E.sel = E.list.length - 1; drawEditor(); return;
  }
  if(t.dataset.addstep && m){ m.steps.push(defaultStep(t.dataset.addstep)); drawEditor(); return; }
  if(t.dataset.act && m){
    const i = +t.closest('.step').dataset.i;
    if(t.dataset.act === 'del') m.steps.splice(i, 1);
    if(t.dataset.act === 'up' && i > 0) [m.steps[i - 1], m.steps[i]] = [m.steps[i], m.steps[i - 1]];
    if(t.dataset.act === 'down' && i < m.steps.length - 1)
      [m.steps[i + 1], m.steps[i]] = [m.steps[i], m.steps[i + 1]];
    drawEditor(); return;
  }
  if(t.dataset.mdel && m){
    E.list.splice(E.sel, 1);
    E.sel = Math.min(E.sel, E.list.length - 1); drawEditor(); return;
  }
  if(t.dataset.mclose){ closeEditor(); return; }
  if(t.dataset.msave){
    const clean = E.list.map(x => ({id: x.id, title: x.title,
      steps: x.steps.map(({_num, ...rest}) => rest)}));
    try{
      const r = await api('/api/broadcast/macros', {macros: clean});
      S.macros = r.macros || [];
      closeEditor();
      toast('Макросы сохранены');
    }catch(err){ toast('Не сохранилось: модуль трансляции недоступен'); }
  }
});

$('#modal').addEventListener('change', e => {
  const el = e.target, row = el.closest('.step');
  if(!row || !E) return;
  const st = E.list[E.sel].steps[+row.dataset.i];
  const k = el.dataset.k;
  if(k === 'type'){ E.list[E.sel].steps[+row.dataset.i] = defaultStep(el.value); drawEditor(); return; }
  if(k === 'carmode'){
    st.car = el.value === 'num' ? '' : el.value;
    st._num = el.value === 'num';
    drawEditor(); return;
  }
  if(k === 'sec') st.sec = +el.value;
  else if(k === 'car') st.car = el.value.trim().replace(/^#/, '');
  else st[k] = el.value;
});

$('#modal').addEventListener('input', e => {
  if(e.target.id === 'mtitle' && E) E.list[E.sel].title = e.target.value;
  const row = e.target.closest('.step');
  if(row && E && e.target.dataset.k === 'car')
    E.list[E.sel].steps[+row.dataset.i].car = e.target.value.trim().replace(/^#/, '');
});

// ---------- камера на пилота и поиск ----------

async function switchTo(car){
  const r = await api('/api/broadcast/camera', {car});
  S.hold = 0;
  if(r.ok){
    if(S.cards) S.cards.focus_car_idx = r.current.car_idx;
    S.cams.current = r.current;
    renderCards(); renderCams();
    toast(`Камера: #${car}`);
  }else toast('Камера не переключилась: сим не готов');
}

$('#q').addEventListener('input', () => { S.hold = 0; renderCards(); });
$('#q').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    // точное совпадение номера важнее: «1» — это №1, а не №14, идущий выше
    const q = e.target.value.trim().replace(/^#/, '');
    const rows = visibleRows();
    const pick = rows.find(r => r.car_number === q) || rows[0];
    if(pick) switchTo(pick.car_number);
  }else if(e.key === 'Escape'){
    e.target.value = ''; renderCards(); e.target.blur();
  }
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if(e.key === '/' && tag !== 'INPUT' && tag !== 'SELECT' && $('#modal').hidden){
    e.preventDefault(); $('#q').focus(); $('#q').select();
  }
});

pollState().then(loadMacros);
pollCards();
setInterval(pollCards, 600);
setInterval(pollState, 1500);
setInterval(loadMacros, 2500);
</script>
