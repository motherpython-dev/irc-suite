<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/icon.png" sizes="any">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="mobile-web-app-capable" content="yes">
<title>iRC · пульт</title>
<link rel="stylesheet" href="/ui/irc.css">
<style>
  /* Пульт эфира: окно поверх сима, телефон, второй ПК. Содержимое то же,
     что во вкладке «Пульт» главного окна: рисует /ui/deck.js. */
  .content{display:block;overflow:hidden}
  .pg{height:100%;display:grid;gap:8px;min-height:0}
  .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tab{cursor:default}
  @media (max-width:640px){ .top .sess .trk{display:none} .tab{padding:0 12px} }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <span class="brand"><img src="/assets/logo.png" alt="iRC"></span>
    <span class="tab" aria-current="page">Пульт</span>
    <span class="grow"></span>
  </header>
  <main class="content" id="view"></main>
  <footer class="status" id="status"></footer>
</div>

<script src="/ui/irc.js"></script>
<script src="/ui/deck.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = irc.esc;
let state = null;
const bcOn = () => !!(state && (state.modules || []).some(m => m.id === 'broadcast' && m.started));

function draw(){
  irc.setHTML($('#view'), bcOn() ? irc.deck.html()
    : `<div class="pg" data-key="off"><section class="p" style="align-self:start"><div class="ph">Пульт эфира<span class="r">${state ? 'модуль выключен' : 'нет связи'}</span></div>
        <div class="pb dim">${state ? 'Модуль трансляции выключен — включите его в главном окне программы.'
          : 'Нет связи с программой — она запущена?'}</div></section></div>`);
}

function apply(st){
  state = st;
  irc.deck.setState(st);
  const air = (((st.modules || []).find(m => m.id === 'broadcast') || {}).overlays || []).filter(o => o.visible);
  irc.setHTML($('#status'), `${air.length ? `<span class="s er ell">в эфире: ${air.map(o => esc(o.title)).join(' · ')}</span>`
      : '<span class="s">эфир пуст</span>'}${irc.simStatus(st)}<span class="grow"></span><span>iRC v${esc(st.version || '')}</span>`);
  draw();
}

irc.deck.init({draw, active: bcOn});
// без SSE на телефоне за прокси тоже работает: состояние приходит и опросом
async function refresh(){ const st = await irc.get('/api/state'); if(st) apply(st); else if(!state) draw(); }
refresh();
setInterval(refresh, 3000);
try{
  const es = new EventSource('/api/stream');
  es.addEventListener('state', e => apply(JSON.parse(e.data)));
}catch(e){}
</script>
</body>
</html>
