<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/icon.png" sizes="any">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRC</title>
<link rel="stylesheet" href="/ui/irc.css">
<style>
  /* Главное окно. Элементы — из /ui/irc.css; здесь только раскладка вкладок. */
  :root{
    /* имена, которыми пользуется окно «Сообщить об ошибке» (bugreport.js) */
    --surface:var(--panel); --surface-2:var(--raise); --accent:var(--acc);
    --shadow:0 12px 32px -12px #000;
  }
  #tabs{display:contents}
  .content{display:block;overflow:hidden}
  .pg{height:100%;display:grid;gap:8px;min-height:0}
  .pg.scroll{overflow-y:auto;align-content:start;grid-auto-rows:max-content}
  .gate[hidden]{display:none}
  .gate .pb .k{justify-content:center}
  .gate .code{font:500 40px/1.2 var(--f-num);letter-spacing:.2em;color:var(--acc);text-align:center}
  .menu[hidden]{display:none}
  /* «Трансляция» — два режима: «Подготовка» (оверлеи, настройки, оформление)
     и «Эфир» (пульт: кнопки эфира, камеры, пилоты, макросы). Сверху — переключатель. */
  .bcw{grid-template-rows:auto minmax(0,1fr)}
  .bc-mode{gap:12px;min-width:0}
  /* широкий блок настроек: пары «подпись — значение» в несколько колонок */
  .kv.wide{grid-template-columns:repeat(auto-fill,128px minmax(250px,1fr))}
  .kv.wide > .rest{grid-column:2/-1}
  .kv.wide > .lab1{grid-column:1}
  /* группы внутри блока (колонки гонки, практики, шрифты) — линия на всю ширину,
     подпись у первой строки кнопок, а не посередине */
  .kv > .kv-sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0 0}
  .fx-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
  .fx-pick .k{justify-content:center;min-width:0}
  .kv > .lab1{align-self:start;padding-top:9px}
  .seg-big{display:inline-flex;flex:none;background:var(--raise);border-radius:5px 5px 2px 2px;overflow:hidden}
  .seg-big button{height:var(--h-m);padding:0 22px;font:800 12px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
                  box-shadow:inset 0 -2px 0 var(--edge);display:flex;align-items:center;gap:10px}
  .seg-big button:hover{color:#C3C9D3}
  .seg-big button[aria-pressed="true"]{color:#fff;box-shadow:inset 0 -3px 0 var(--acc),0 8px 14px -6px rgba(255,90,31,.7)}
  .seg-big button.onair[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,#2A1717,#211517);
                  box-shadow:inset 0 -3px 0 var(--air),0 8px 14px -6px rgba(255,45,45,.8)}
  .seg-big .dot{width:8px;height:8px;border-radius:50%;background:var(--air)}
  .seg-big .onair[aria-pressed="true"] .dot{background:#fff}
  /* «Подготовка»: список оверлеев, справа предпросмотр и настройки.
     В узком окне предпросмотр встаёт над настройками. */
  .bc{display:grid;gap:8px;min-height:0;align-items:start;grid-template-rows:minmax(0,1fr);
      grid-template-columns:minmax(280px,1fr) minmax(280px,1fr) minmax(320px,1.1fr);grid-template-areas:"list out set"}
  .bc > .bc-list{grid-area:list} .bc > .bc-out{grid-area:out} .bc > .bc-setp{grid-area:set}
  .bc-prev{background:linear-gradient(160deg,#4B6278,#1C232C);border-radius:var(--r-m);height:230px;flex:none;min-width:0;overflow:hidden;position:relative}
  #ovprev{position:absolute;left:12px;top:12px;border:0;display:block;color-scheme:normal;transform-origin:0 0;width:360px;height:200px}
  .bc-list .tr{grid-template-columns:32px minmax(0,1fr) auto}
  .bc .kv{grid-template-columns:120px minmax(0,1fr)}
  .bc .kv .row{flex-wrap:wrap;min-width:0}
  /* узкое окно: «Вывод» — под списком оверлеев */
  @media (max-width:1180px){
    .bc{grid-template-columns:minmax(270px,1fr) minmax(300px,1.1fr);grid-template-rows:auto minmax(0,1fr);
        grid-template-areas:"list set" "out set";overflow-y:auto}
    .bc > .p{max-height:none}
    .bc .seg button{padding:0 8px;letter-spacing:.05em}
  }
  /* редактор оверлеев: свой фрейм поверх содержимого, живёт всю сессию —
     несохранённые правки не теряются при смене вкладки */
  #edhost{position:fixed;left:0;right:0;top:48px;bottom:28px;z-index:5;background:var(--bg)}
  #edhost[hidden]{display:none}
  #edhost iframe{width:100%;height:100%;border:0;display:block}
  .menu .row{flex-wrap:wrap}
  .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .err{color:var(--hit-text)}
  .note{color:var(--dim);line-height:1.5}
  .pb input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--acc)}
  /* кнопка «Сообщить об ошибке» в шапке — в стиле вкладок */
  .top .bgr-hbtn{width:40px;height:auto;margin:7px 2px;border:0;border-radius:var(--r-s);background:none;color:var(--dim)}
  .top .bgr-hbtn:hover{background:var(--raise);color:var(--acc)}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="/"><img src="/assets/logo.png" alt="iRC"></a>
    <div id="tabs"></div>
    <span class="grow"></span>
    <button class="acct out" id="acct" title="Аккаунт irchamps.gg"></button>
  </header>
  <main class="content" id="view"></main>
  <div id="edhost" hidden></div>
  <footer class="status" id="status"></footer>
</div>
<div class="menu" id="menu" hidden></div>
<div class="gate" id="lock" hidden></div>

<script src="/ui/irc.js"></script>
<script src="/ui/rc.js"></script>
<script src="/ui/deck.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = irc.esc;
let state = {modules: []};
let tab = 'overview';
let events = [];                         // журнал на «Обзоре»
let acctOpen = false;

const TABS = [['overview','Обзор'], ['racecontrol','Рейс-контроль'], ['broadcast','Трансляция'],
              ['pilot','Оверлей'], ['rutp','RUTP']];
// «Трансляция»: режим (prep — подготовка, live — эфир) и вид подготовки
// (set — настройки и предпросмотр, edit — оформление в редакторе). Режим
// помнится между запусками окна.
let bcMode = (() => { try{ return localStorage.getItem('irc.bcMode') || 'prep'; }catch(e){ return 'prep'; } })();
let prepView = 'set';
const TITLES = {racecontrol:'Рейс-контроль', broadcast:'Трансляция', rutp:'RUTP',
                telemetry:'Телеметрия', pilot:'Оверлей'};
const OUTCOME = {racing:'гоночный инцидент', penalty:'наказание в гонке', review:'изучить после гонки'};
const PENALTY = {drive_through:'проезд', time_penalty:'штраф', dq:'дисквалификация', eol:'в конец колонны'};

const mod = id => state.modules.find(x => x.id === id);
const fmtTime = s => { s = Math.max(0, s|0);
  return [s/3600|0, s%3600/60|0, s%60].map(v => String(v).padStart(2,'0')).join(':'); };
const toast = irc.toast;
const post = irc.post;

/* ======================= шапка, состояние, аккаунт ======================= */

function renderTop(st){
  irc.setHTML($('#tabs'), TABS.map(([id, t], i) =>
    `<button class="tab" data-tab="${id}" ${tab === id ? 'aria-current="page"' : ''}>${t}<kbd>${i+1}</kbd></button>`).join(''));
  renderAccount(st);
  renderStatus(st);
}

function renderAccount(st){
  const l = st.license; if(!l) return;
  const u = l.user || {};
  const name = u.display_name || u.username || '';
  const btn = $('#acct');
  btn.classList.toggle('out', !l.linked);
  irc.setHTML(btn, `<span class="ini">${l.linked && name ? esc(name.trim()[0].toUpperCase()) : '?'}</span>${
    l.linked ? esc(name || 'Аккаунт') : l.login_pending ? 'Вход…' : 'Войти'}`);
  const menu = $('#menu');
  menu.hidden = !acctOpen;
  if(!acctOpen) return;
  let body;
  if(l.linked){
    body = `<div class="mi"><div style="font-weight:700;font-size:14px">${esc(name)}</div>
        <div class="dim">${u.iracing_customer_id ? 'iRacing ' + esc(u.iracing_customer_id) + ' · irchamps.gg'
          : 'iRacing не привязан — привяжите его в настройках сайта'}</div></div>
      <div class="mi dim">Программа подключена к аккаунту. Решения маршала уходят в «Судейство».</div>
      <div class="mi"><button class="k s full center" data-act="lic-unlink">Отвязать</button></div>`;
  }else if(l.login_pending){
    body = `<div class="mi dim">Войдите на сайте в открывшемся браузере — программа подключится сама.</div>
      <div class="mi row"><button class="k s" data-act="lic-open">Открыть вход снова</button>
        <button class="k s" data-act="lic-login">Заново</button></div>`;
  }else{
    body = `<div class="mi dim">${l.enforced ? 'Без подключения программа не работает.'
        : 'Подключите программу к своему аккаунту — вход через Discord, как на сайте.'}</div>
      <div class="mi"><button class="k s pri full center" data-act="lic-login">Войти через irchamps.gg</button></div>`;
  }
  irc.setHTML(menu, body);
}

function renderStatus(st){
  const l = st.license || {};
  const rc = mod('racecontrol'), bc = mod('broadcast');
  const live = rc && rc.live;
  const s = [];
  s.push(l.linked ? '<span class="s ok">аккаунт irchamps.gg</span>'
         : l.allowed === false ? '<span class="s er">нет входа</span>'
         : '<span class="s wa">аккаунт не подключён</span>');
  if(rc && rc.started){
    if(live && live.stage) s.push(`<span class="s ok ell">этап · ${esc(live.stage.championship)} · ${esc(live.stage.title)}</span>`);
    else s.push('<span class="s">этап не привязан</span>');
    if(live && live.pending) s.push(`<span class="s wa">решений ждут отправки: ${live.pending}</span>`);
    if(live && live.offline) s.push('<span class="s wa">нет связи с сайтом</span>');
  }
  if(bc && bc.started){
    const air = st.overlays.filter(o => o.visible).length;
    s.push(air ? `<span class="s er">в эфире: ${air}</span>` : '<span class="s">эфир пуст</span>');
  }
  s.push(irc.simStatus(st));                 // режим сима — справа от эфира
  if(st.update && (st.update.state === 'core_ready' || st.update.state === 'bundle_ready')) s.push('<span class="s wa">обновление готово</span>');
  s.push(`<span class="grow"></span><span>iRC v${esc(st.version || '')}</span>`);
  irc.setHTML($('#status'), s.join(''));
}

/* ======================= вход: затемнение над содержимым ======================= */

let licTimer = null;
function licenseGate(l){
  const p = l.pairing;
  // имя может остаться от отозванной установки — показываем только при привязке
  const linked = !!(l.linked && l.user && l.user.username);
  let body;
  if(p){
    body = `<div class="code">${esc(p.code)}</div>
      <div class="dim">Подтвердите код на сайте — программа включится сама. Ждём подтверждения…</div>
      <div class="row"><button class="k grow" data-act="lic-open">Открыть сайт</button>
        <button class="k" data-act="lic-code">Новый код</button></div>`;
  }else if(l.reason === 'no_iracing' || l.reason === 'not_confirmed'){
    body = `<div class="row"><button class="k pri grow" data-act="lic-open">Открыть настройки на сайте</button>
      <button class="k" data-act="lic-check">Проверить снова</button></div>`;
  }else if(l.reason === 'other_account'){
    body = `<div class="dim">На сайте привязан аккаунт ${esc(l.user.iracing_customer_id || '')},
      а в iRacing сейчас ${esc(l.sim_customer_id || '')}. Войдите в сим под своим аккаунтом.</div>
      <button class="k s" data-act="lic-unlink">Отвязать эту установку</button>`;
  }else if(l.reason === 'offline_expired'){
    body = `<button class="k l pri full" data-act="lic-check">Проверить связь</button>`;
  }else if(l.login_pending){
    body = `<div class="dim">Войдите на сайте в открывшемся браузере — программа включится сама. Ждём входа…</div>
      <div class="row"><button class="k grow" data-act="lic-open">Открыть вход снова</button>
        <button class="k" data-act="lic-login">Начать заново</button></div>`;
  }else{
    body = `<button class="k l pri full" data-act="lic-login">Войти через irchamps.gg <kbd>Enter</kbd></button>
      <div class="row"><span class="lbl">Нет браузера?</span>
        <button class="k s" data-act="lic-code">Войти по коду с телефона</button>
        ${linked ? '<span class="grow"></span><button class="k s" data-act="lic-unlink">Отвязать</button>' : ''}</div>`;
  }
  return `<div class="card"><div class="ph">Подключите программу</div><div class="pb">
    <div class="dim">${esc(l.message || 'Нужен аккаунт на irchamps.gg с привязанным iRacing.')}
      Без входа модули стоят, вкладки открываются.</div>
    ${linked ? `<div class="lbl">аккаунт: ${esc(l.user.display_name || l.user.username)}</div>` : ''}
    ${body}</div></div>`;
}

function ensureLicPoll(l){
  const on = !!(l && l.pairing);
  if(on && !licTimer){
    licTimer = setInterval(async () => {
      const r = await post('/api/license/pair/poll', {}, true);
      if(r.status === 'approved'){ toast('Программа подключена', 'ok'); refresh(); }
    }, 3000);
  }else if(!on && licTimer){ clearInterval(licTimer); licTimer = null; }
}

// Без входа вкладки переключаются, а содержимое лежит под затемнением с
// карточкой входа и не принимает ни кликов, ни клавиатуры (inert).
function locked(){ const l = state.license; return !!(l && !l.allowed); }
function renderLock(){
  const el = $('#lock');
  const lock = locked();
  $('#view').inert = lock;
  $('#edhost').inert = lock;
  el.hidden = !lock;
  if(!lock){ ensureLicPoll(null); return; }
  irc.setHTML(el, licenseGate(state.license));
  ensureLicPoll(state.license);
}

/* ======================= вкладки ======================= */

// полукруг-шкала с цифрой внутри: v — доля заполнения 0..1
function gauge(v, txt, on){
  const R = 30, C = 2 * Math.PI * R, sw = .75, f = on ? Math.max(0, Math.min(1, v)) : 0;
  return `<svg class="gauge${on ? '' : ' off'}" width="84" height="84" viewBox="-42 -42 84 84" aria-hidden="true">
    <circle class="t" r="${R}" stroke-dasharray="${C * sw} ${C}" transform="rotate(135)"/>
    ${f > 0 ? `<circle class="v" r="${R}" stroke-dasharray="${C * sw * f} ${C}" transform="rotate(135)"/>` : ''}
    <text y="7" text-anchor="middle">${esc(txt)}</text></svg>`;
}
// frac — заполнение шкалы (доля из целого); нет доли — полная, пока модуль работает
function modPanel(id, big, label, sub, frac){
  const st = mod(id), on = !!(st && st.started);
  return `<section class="p"><div class="ph">${TITLES[id]}<span class="r">${!st ? 'позже' : on ? 'работает' : 'выключен'}</span></div>
    <div class="pb" style="flex:1;justify-content:space-between">
      <div class="row" style="gap:14px">${gauge(frac ?? 1, on ? big : '—', on)}<div style="min-width:0">
        <div class="cap ${st ? 'dim' : 'faint'}">${label}</div>
        <div class="dim ell" style="margin-top:4px;height:20px">${!st ? 'модуль появится позже' : on ? esc(sub) : 'модуль выключен'}</div>
        ${st && st.error ? `<div class="err">${esc(st.error)}</div>` : ''}</div></div>
      <div class="row" style="justify-content:space-between">${irc.onoff('mod:' + id, on, !st)}${
        st && tab !== id ? `<button class="k s" data-tab="${id}">Открыть</button>` : ''}</div></div></section>`;
}

function updateRow(){
  const u = state.update || {};
  const busy = u.state === 'checking';
  const note = u.message || `Обновлений нет · версия ${state.version || ''} · проверка раз в час`;
  return `<div class="row" style="border-top:1px solid var(--line);padding-top:12px">
    <div class="grow"><div class="cap">Обновления${u.new_version ? ' · ' + esc(u.new_version) : ''}</div>
      <div class="dim ell">${esc(note)}</div></div>
    ${u.state === 'core_ready'
      ? '<button class="k s pri" data-act="upinstall">Установить и перезапустить</button>'
      : u.state === 'bundle_ready'
      ? '<button class="k s pri" data-act="uprestart">Перезапустить</button>'
      : `<button class="k s" data-act="upcheck" ${busy ? 'disabled' : ''}>${busy ? 'Проверяю…' : 'Проверить'}</button>`}</div>`;
}

const hhmm = at => { const d = new Date(String(at).replace(' ', 'T') + 'Z');
  return isNaN(d) ? '' : d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); };

// одна строка журнала: [модуль, текст]
function eventLine(e){
  const p = e.payload || {};
  switch(e.kind){
    case 'app_start': return ['Программа', `запущена · v${p.version || ''}`];
    case 'app_stop': return ['Программа', 'закрыта'];
    case 'demo': return ['Программа', p.on ? 'демо-гонка включена' : 'демо-гонка выключена'];
    case 'mode_change': return ['Сим', `${p.from || '—'} → ${p.to || '—'}`];
    case 'module_toggled': return [TITLES[p.module] || p.module, p.enabled ? 'включён' : 'выключен'];
    case 'incident_detected': return ['Рейс-контроль',
      `#${p.car_number} ${p.driver_name || ''} ${p.kind === 'incident' || !p.kind ? '+' + (p.inc_delta || 0) + 'x' : 'вне трассы'} · круг ${p.lap ?? '—'}`];
    case 'decision': return ['Рейс-контроль', `#${p.car || ''} ${p.driver_name || ''}: ${
      p.outcome === 'penalty' ? (PENALTY[p.penalty] || 'наказание') + (p.seconds ? ' ' + p.seconds + ' с' : '')
      : OUTCOME[p.outcome] || p.outcome}`];
    case 'chat_command_sent': return ['Рейс-контроль', `в чат сима: ${p.text || ''}`];
    case 'camera_changed': return ['Камера', p.camera || ''];
    case 'rutp': return ['RUTP', p.text || ''];
    default: return ['Программа', e.kind];
  }
}

function pageOverview(){
  const rc = mod('racecontrol') || {}, bc = mod('broadcast') || {};
  const live = rc.live || {};
  const air = state.overlays.filter(o => o.visible);
  const cols = '56px 128px 1fr';
  return `<div class="pg" data-key="overview" style="grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr)">
    ${modPanel('racecontrol', rc.incidents ?? 0, 'инцидентов',
       live.stage ? `${live.stage.championship} · ${live.stage.title}` : 'этап не привязан')}
    ${modPanel('broadcast', air.length, 'в эфире', air.map(o => o.title).join(' · ') || 'эфир пуст',
       air.length / Math.max(1, (state.overlays || []).length || OV.length))}
    ${(() => { const pv = ((mod('pilot') || {}).overlays || []).filter(o => o.visible);
      return modPanel('pilot', pv.length, 'окон включено', pv.map(o => o.title).join(' · ') || 'окна выключены',
        pv.length / Math.max(1, ((mod('pilot') || {}).overlays || []).length)); })()}
    ${modPanel('telemetry', (mod('telemetry') || {}).laps ?? 0, 'кругов записано', (mod('telemetry') || {}).state || '',
       ((mod('telemetry') || {}).laps || 0) > 0 ? 1 : 0)}
    <section class="p" style="grid-column:1/3"><div class="ph">Действия</div><div class="pb">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="k full ${state.overlay_visible ? 'sel' : ''}" data-act="rc-overlay">Рейс-контроль поверх сима<kbd>${state.overlay_visible ? 'показан' : 'скрыт'}</kbd></button>
        <button class="k full ${state.deck_visible ? 'sel' : ''}" data-act="deck">Пульт поверх сима<kbd>${state.deck_visible ? 'показан' : 'скрыт'}</kbd></button>
        <button class="k full" data-act="editor">Редактор оверлеев<kbd>5</kbd></button>
      </div>
      ${updateRow()}</div></section>
    <section class="p" style="grid-column:3/5"><div class="ph">Журнал<span class="r">последние ${events.length}</span></div>
      <div class="tr h" style="grid-template-columns:${cols}"><span>Время</span><span>Модуль</span><span>Событие</span></div>
      <div class="scroll" style="flex:1">${events.length ? events.map(e => { const [m, t] = eventLine(e);
        return `<div class="tr" data-key="${e.id}" style="grid-template-columns:${cols}"><span class="num dim">${hhmm(e.at)}</span>

function showEditor(on, ov){
  const host = $('#edhost');
  host.hidden = !on;
  // модуль выключили — фрейм убираем: после включения он загрузится заново, а не останется с «404»
  if(!on){ if(!(mod('broadcast') || {}).started) host.innerHTML = ''; return; }
  let f = host.querySelector('iframe');
  if(!f){
    f = document.createElement('iframe');
    f.title = 'Редактор оверлеев';
    f.src = '/editor?embed=1' + (ov ? '&ov=' + encodeURIComponent(ov) : '');
    host.appendChild(f);
  }else if(ov){
    f.contentWindow.postMessage({irc: 'ov', id: ov}, location.origin);
  }
  f.focus();
}
// Оформление — режим «Подготовка», вид «Оформление»: фрейм редактора встаёт
// поверх области под переключателем режимов
function placeEditor(ov){
  const on = tab === 'broadcast' && bcMode === 'prep' && prepView === 'edit' && !!(mod('broadcast') || {}).started;
  showEditor(on, ov);
  const bar = on && document.querySelector('.bc-mode');
  if(bar) $('#edhost').style.top = Math.round(bar.getBoundingClientRect().bottom + 8) + 'px';
}
function setBcMode(mode, view){
  bcMode = mode;
  if(view) prepView = view;
  try{ localStorage.setItem('irc.bcMode', mode); }catch(e){}
  renderView();
}
function openEditor(ov){
  if(tab !== 'broadcast'){ tab = 'broadcast'; renderTop(state); }
  bcMode = 'prep'; prepView = 'edit';
  try{ localStorage.setItem('irc.bcMode', 'prep'); }catch(e){}
  renderView();
  placeEditor(ov);
}

window.addEventListener('message', e => {

function pageTelemetry(){

  const on = !!st.started;

  const flag = {pit_in: 'заезд', pit_out: 'выезд', off_track: 'вне трассы', incident: 'инцидент', yellow: 'жёлтый'};
  // сим подключён, а кадры не идут — это поломка, её надо видеть сразу
  const stale = on && st.connected && (st.last_frame_age_s == null || st.last_frame_age_s > 3);
  const drop = st.dropped || {};
  const ty = st.tyres;
  const avg = a => { const v = (a || []).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  const corner = c => {
    const tr = ty && ty.tires && ty.tires[c] || {}, w = avg(ty && ty.wear_pct && ty.wear_pct[c]);
    const temps = (tr.temp || []).map(x => x == null ? '—' : x.toFixed(0)).join(' · ');
    return `<div style="border:1px solid var(--line);border-radius:var(--r-m);padding:8px 10px;min-width:0">
      <div class="row" style="justify-content:space-between"><span class="cap dim">${c}</span>
        <span class="num" style="font-size:18px;color:${w == null ? 'var(--faint)' : w < 60 ? 'var(--warn)' : 'var(--fg)'}">${w == null ? '—' : w.toFixed(0) + '%'}</span></div>
      <div class="num dim ell" title="температура в боксе: внутр. · центр · внеш.">${temps || '—'} °C</div></div>`;
  };
  const g = ty && ty.g || {};
  const tyrePanel = `<section class="p" style="grid-column:1/-1"><div class="ph">Резина и нагрузка<span class="r">${ty ? `круг ${ty.lap} · ${ty.laps} кр. на комплекте` : 'после первого круга'}</span></div><div class="pb">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">${['LF', 'RF', 'LR', 'RR'].map(corner).join('')}</div>
    <div class="row dim" style="flex-wrap:wrap;gap:16px"><span>трек ${ty && ty.track_temp != null ? ty.track_temp.toFixed(1) + '°' : '—'}</span>
      <span>бок. ср. ${g.lat_mean != null ? g.lat_mean.toFixed(2) + ' g' : '—'}</span><span>торм. макс ${g.brake_max != null ? g.brake_max.toFixed(2) + ' g' : '—'}</span>
      <span>разгон макс ${g.accel_max != null ? g.accel_max.toFixed(2) + ' g' : '—'}</span><span>работа ${g.work_kj_kg != null ? g.work_kj_kg.toFixed(1) + ' кДж/кг' : '—'}</span></div>
    <div class="note">Износ и температуры iRacing обновляет только в боксе — здесь последний замер. По ходу езды температура
      поверхности есть только в .ibt: она попадает в круги после пересчёта из .ibt. Всё пишется в сводку каждого круга.</div></div></section>`;
  return `<div class="pg" data-key="telemetry" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);overflow:auto">
    <section class="p"><div class="ph">Телеметрия своей машины<span class="r">${on ? 'работает' : 'выключен'}</span></div><div class="pb">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div><div class="big" style="color:${on && st.session ? 'var(--fg)' : 'var(--faint)'}">${on && st.session ? st.laps : '—'}</div>
          <div class="cap dim" style="margin-top:8px">кругов в сессии</div></div>
        <div style="text-align:right;min-width:0"><div class="dim ell">${on ? esc(st.state) : 'включите — круги начнут записываться'}</div>
          ${on && st.setup_id ? `<div class="tag" style="margin-top:4px">сетап ${st.setup_id}</div>` : ''}</div></div>
      <div class="row">${irc.onoff('mod:telemetry', on)}<span class="grow"></span>
        <button class="k s" data-act="telem-open">Открыть папку</button></div>
      ${stale ? `<div style="border:1px solid var(--air);border-radius:var(--r-m);padding:10px 12px" class="tag" title="${esc(st.last_error || '')}">
        <span style="color:var(--hit-text)">■ кадры не приходят</span></div>` : ''}
      ${on && st.last_error ? `<div class="dim ell" title="${esc(st.last_error)}">ошибок: ${st.errors} · ${esc(st.last_error)}</div>` : ''}
      </div></section>
    <section class="p"><div class="ph">Настройки</div><div class="pb"><div class="kv">
      <span class="k-label">Запись .ibt</span><span class="row">${irc.onoff('telem-ibt', st.auto_ibt, !on)}
        <span class="dim">${st.ibt_logging ? 'iRacing пишет сейчас' : 'включать при выезде'}</span></span>
      <span class="k-label">Сессия</span><span class="dim ell" title="${esc(st.session || '')}">${esc(st.session || '—')}</span>
      <span class="k-label">Отправка</span><span class="dim ell" title="снимки сетапа и сводки кругов, .ibt остаётся здесь">на irchamps.gg · ${esc(st.upload_state || 'ждёт данных')}</span>
      <span class="k-label">Из .ibt</span><span class="row"><span class="dim ell grow">${esc(st.ibt_state || 'после сессии — сам')}</span>

      <span class="k-label">Кадры</span><span class="num dim ell" title="отброшено: повтор ${drop.not_live || 0}, вне трассы ${drop.not_on_track || 0}, без сессии ${drop.no_session || 0}, повтор кадра ${drop.same_tick || 0}, ошибки ${drop.error || 0}">${st.frames_used || 0} / ${st.frames_in || 0}</span>
      <span class="k-label">Каналов в симе</span><span class="num">${st.vars || '—'}${st.missing_live && st.missing_live.length ? ` <span class="dim">· только в .ibt: ${esc(st.missing_live.join(', '))}</span>` : ''}</span>
      <span class="k-label">Папка</span><span class="dim ell" title="${esc(st.root || '')}">${esc(st.root || '')}</span>
      <span class="k-label">Радар: сбор</span><span class="row">${irc.onoff('telem-radar', radarProbe.on, !on)}
        <span class="dim ell">${radarProbe.on ? `переключений ${radarProbe.flips || 0} · замеров ${radarProbe.samples || 0}` : 'пишет, когда iRacing видит машину рядом'}</span></span>
      ${radarLine('Включается', radarProbe.turn_on_m)}${radarLine('Выключается', radarProbe.turn_off_m)}</div>
      <div class="note">Запись .ibt — полная телеметрия iRacing 360 Гц: iRC включает её при выезде из бокса
        и выключает в боксе, а файл запоминает за сессией.</div></div></section>
    ${tyrePanel}
    <section class="p" style="grid-column:1/-1;min-height:240px"><div class="ph">Последние круги<span class="r">${esc(telemLaps.session || '')}</span></div>
      <div class="tr h" style="grid-template-columns:${cols}"><span class="ar">Круг</span><span class="ar">Сетап</span><span class="ar">Время</span><span class="ar">Топл.</span><span>Отметки</span></div>
      <div class="scroll" style="flex:1">${telemLaps.rows.length ? telemLaps.rows.map(r => `<div class="tr" style="grid-template-columns:${cols}">
        <span class="num ar">${r.lap}</span><span class="num ar dim">${r.setup_id ?? '—'}</span>
        <span class="num ar" ${r.valid ? '' : 'style="color:var(--faint)"'}>${r.lap_time != null ? r.lap_time.toFixed(3) : '—'}</span>
        <span class="num ar dim">${r.fuel_used != null ? r.fuel_used.toFixed(2) : '—'}</span>
        <span class="tag" style="color:${r.valid ? 'var(--on)' : 'var(--warn)'}">${r.valid ? 'чистый' : r.flags.map(f => flag[f] || f).join(' · ')}</span></div>`).join('')
        : `<div class="pb dim">${on ? 'Круги появятся после первого пересечения линии.' : 'Модуль выключен.'}</div>`}</div></section>
  </div>`;
}

          ${Object.keys(learned).length ? '<button class="k s" data-plforget="1">Забыть</button>' : ''}</span>`, true)}
    ${plSection('setups', plSetups(), true)}

}
let plTimer = null;

document.addEventListener('input', e => {

irc.on('seg', (key, v) => {

const PAGES = {overview: pageOverview, racecontrol: pageRaceControl, broadcast: pageBroadcast,
               rutp: pageRutp, telemetry: pageTelemetry, pilot: pagePilot};
// ссылка вида /#rutp открывает сразу нужную вкладку
{ const h = location.hash.slice(1); if(PAGES[h]){ tab = h; if(h === 'pilot') setTimeout(loadPilot, 300); } }

// Предпросмотр оверлея: страница оверлея фиксированной ширины (башня — 360 px).
// Подгоняем её размер под содержимое и уменьшаем, если места меньше, — чтобы
// оверлей был виден целиком, а не обрезан. Правило — отдельным <style>:
// атрибут style у фрейма перезаписала бы перерисовка вкладки.
const fitStyle = document.head.appendChild(document.createElement('style'));
function fitPreview(){
  const f = document.getElementById('ovprev');
  if(!f) return;
  let w = 360, h = 200;
  try{
    // размер самого оверлея — как в редакторе: у его блока, а не у страницы
    const ov = f.contentWindow && f.contentWindow.irOverlay;
    const el = ov && ov.frame ? ov.frame() : null;
    if(el){
      const r = el.getBoundingClientRect();
      w = Math.max(40, Math.ceil(r.right) + 12); h = Math.max(40, Math.ceil(r.bottom) + 12);
    }else if(f.contentDocument && f.contentDocument.body){
      const b = f.contentDocument.body;
      w = Math.max(40, b.scrollWidth); h = Math.max(40, b.scrollHeight);
    }
  }catch(e){}
  const box = f.parentElement;
  const s = Math.min(1, (box.clientWidth - 24) / w, (box.clientHeight - 24) / h);
  const css = `#ovprev{width:${w}px;height:${h}px;transform:scale(${Math.max(0.2, s).toFixed(3)})}`;
  if(fitStyle.textContent !== css) fitStyle.textContent = css;
}
setInterval(() => { if(tab === 'broadcast') fitPreview(); }, 500);
window.addEventListener('resize', fitPreview);

let shownTab = '', shownOv = '';
function renderView(){
  irc.setHTML($('#view'), PAGES[tab]());
  // поля настроек оверлея заполняем, когда они появились; дальше их не трогаем
  const fresh = tab === 'broadcast' && (shownTab !== 'broadcast' || shownOv !== ovSel);
  shownTab = tab; shownOv = ovSel;
  if(fresh) loadBroadcast();
  placeEditor();
}
window.addEventListener('resize', () => placeEditor());

function go(id){
  if(!PAGES[id] || id === tab) return;
  tab = id; acctOpen = false;
  renderTop(state); renderView();
  if(id === 'overview') loadEvents();
  if(id === 'telemetry') loadTelemLaps();
  if(id === 'pilot') loadPilot();
}

/* ======================= действия ======================= */

// «вкл | выкл»: кнопка переключается сразу, сервер подтверждает следующим состоянием
irc.on('onoff', async (key, on, btn) => {
  btn.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  let r;
  if(key.startsWith('mod:')){
    const id = key.slice(4);
    r = await post('/api/modules/set', {id, enabled: on});
    if(r.ok) toast(`${TITLES[id] || id}: ${on ? 'включён' : 'выключен'}`, on ? 'ok' : '');
    if(id === 'pilot') setTimeout(loadPilot, 300);
  }else if(key.startsWith('ov:')){
    const id = key.slice(3);
    r = await post('/api/broadcast/visibility', {id, visible: on});
    if(r.overlays) toast(`${(r.overlays.find(o => o.id === id) || {}).title || id}: ${on ? 'в эфире' : 'убран'}`, on ? 'er' : '');
  }else if(key.startsWith('pl:')){
    const id = key.slice(3);
    r = await post('/api/pilot/visibility', {id, visible: on});
    if(r.ok){ pl = r; toast(`${(r.overlays.find(o => o.id === id) || {}).title || id}: ${on ? 'включён' : 'выключен'}`, on ? 'ok' : ''); }
  }else if(key.startsWith('plf:')){
    const [id, k] = key.slice(4).split('.');
    await plSave(id, {[k]: on ? 1 : 0});
    return;
  }else if(key === 'deck'){
    r = await post('/api/broadcast/deck', {visible: on});
    if(r.ok !== false) toast(on ? 'Пульт показан' : 'Пульт скрыт');
  }else if(key === 'lan'){
    r = await post('/api/lan', {allow: on});
    if(r.ok) toast(on ? 'Доступ с телефона включён — перезапустите iRC' : 'Доступ с телефона выключен — нужен перезапуск', 'wa');
  }else if(key === 'telem-radar'){
    r = await post('/api/telemetry/radar', {on});
    if(r.ok){ radarProbe = r; toast(on ? 'Радар: сбор включён — езжайте в трафике' : 'Радар: сбор выключен', 'ok'); }
    else toast(r.message || 'Не включилось', 'er');
  }else if(key === 'telem-ibt'){
    r = await post('/api/telemetry/settings', {auto_ibt: on});
    if(r.ok) toast(on ? 'Запись .ibt будет включаться при выезде' : 'Запись .ibt не включается', 'ok');
  }else if(key.startsWith('bs:')){
    await saveSetting(key.slice(3), on);
    return;
  }
  refresh();
});

const LIC = {login: '/api/license/login/start', code: '/api/license/pair/start',
             open: '/api/license/open', check: '/api/license/check', unlink: '/api/license/unlink'};

document.addEventListener('click', async e => {
  const t = e.target;
  if(t.closest('#acct')){ acctOpen = !acctOpen; renderAccount(state); return; }
  if(acctOpen && !t.closest('#menu')){ acctOpen = false; renderAccount(state); }
  const tb = t.closest('[data-tab]');
  if(tb){ go(tb.dataset.tab); return; }
  const bm = t.closest('[data-bcmode]');
  if(bm){ setBcMode(bm.dataset.bcmode); return; }
  const pv = t.closest('[data-prepview]');
  if(pv){ setBcMode('prep', pv.dataset.prepview); return; }
  const os = t.closest('[data-ovsel]');
  if(os && !t.closest('[data-dk]')){ if(ovSel !== os.dataset.ovsel){ ovSel = os.dataset.ovsel; renderView(); } return; }
  const op = t.closest('[data-open]');
  if(op){ if(op.dataset.open) window.open(op.dataset.open, '_blank'); return; }
  const cp = t.closest('[data-copy]');
  if(cp){ copyUrl(cp.dataset.copy, cp.dataset.direct); return; }
  const a = t.closest('[data-act]');
  if(!a || a.disabled) return;
  const act = a.dataset.act;
  let r;
  if(act.startsWith('lic-')){
    const what = act.slice(4);
    a.disabled = true;
    // браузер открывает сама программа: окно панели не знает входа на сайт
    await post(LIC[what], {});
    a.disabled = false;
    if(what === 'unlink') acctOpen = false;
    refresh();
    return;
  }
  if(act.startsWith('rutp-')){
    const what = act.slice(5);
    a.disabled = true;
    r = what === 'suggest' ? await post('/api/rutp/folder', {path: a.dataset.v})
      : what === 'save' ? await post('/api/rutp/folder', {path: ($('#rutp-path') || {}).value || ''})
                           : await post('/api/rutp/' + what, {}, what === 'pick');
    a.disabled = false;
    if(r.ok !== false){
      if(what === 'pick' || what === 'suggest' || what === 'save') toast('Папка paint выбрана', 'ok');
      else if(what === 'reload') toast('Ливреи загрузятся заново', 'ok');
      else if(what === 'legacy') toast('Отдельный RUTP закрыт — ливреи загружает iRC', 'ok');
    }
    refresh();
    return;
  }
  switch(act){
    case 'uprestart':
      a.disabled = true;
      r = await post('/api/update/restart', {});
      if(r.message) toast(r.message, r.ok === false ? 'er' : 'ok');
      if(r.ok === false) a.disabled = false;
      return;
    case 'upcheck': case 'upinstall':
      a.disabled = true;
      r = await post(act === 'upinstall' ? '/api/update/install' : '/api/update/check', {});
      if(r.message) toast(r.message, r.ok === false ? 'er' : '');
      if(act === 'upcheck') refresh();
      return;
    case 'demo-broadcast': case 'demo-pilot': {
      const scope = act.slice(5), on = !((mod(scope) || {}).demo || {}).on;
      a.disabled = true;
      r = await post(`/api/${scope}/demo`, {on});
      if(r.ok !== false) toast(on ? 'Демо включено' : 'Демо выключено');
      for(const ms of [300, 1500]) setTimeout(refresh, ms);
      return;
    }
    case 'deck':
      r = await post('/api/broadcast/deck', {visible: !state.deck_visible});
      if(r.ok !== false) toast(!state.deck_visible ? 'Пульт показан' : 'Пульт скрыт');
      setTimeout(refresh, 300);
      return;
    case 'rc-overlay':
      r = await post('/api/racecontrol/overlay', {visible: !state.overlay_visible});
      if(r.ok) toast(!state.overlay_visible ? 'Рейс-контроль поверх сима' : 'Окно поверх сима скрыто');
      setTimeout(refresh, 400);
      return;
    case 'rc-web': window.open('/racecontrol', '_blank'); return;
    case 'telem-open': post('/api/telemetry/open', {}); return;
    case 'telem-reprocess':
      r = await post('/api/telemetry/reprocess', {});
      if(r.ok) toast('Пересчёт из .ibt запущен — займёт до минуты', 'ok');
      return;
    case 'editor': openEditor(); return;
    case 'open-editor': openEditor(a.dataset.v); return;
    case 'ov-save': saveOv(a.dataset.v); return;
    case 'delta-save': saveDelta(); return;
    case 'comm-show': showComm(true); return;
    case 'comm-hide': showComm(false); return;
  }
});

irc.keys(Object.assign({
  'Escape': () => { if(!acctOpen) return false; acctOpen = false; renderAccount(state); },
  'Enter': () => { if(!locked() || state.license.pairing || state.license.login_pending) return false;
    const b = $('#lock [data-act="lic-login"]'); if(b) b.click(); },
}, Object.fromEntries(TABS.map(([id], i) => [String(i + 1), () => {
  if(tab === 'broadcast' && bcMode === 'live' && !locked()) return false;    // в «Эфире» цифры — камеры
  go(id);
}]))));

/* ======================= «Трансляция»: настройки ======================= */

async function loadBroadcast(){
  const s = await irc.get('/api/broadcast/settings');
  if(!s) return;
  bset = s;
  const set = (id, v) => { const el = $(id); if(el) el.value = v ?? ''; };
  set('#b-title', s.tower_title); set('#b-top', s.tower_top); set('#b-win', s.tower_window); set('#b-focus', s.focus_car);
  set('#g-title', s.grid_title); set('#g-rows', s.grid_rows);
  set('#p-title', s.pits_title); set('#p-rows', s.pits_rows);
  const pair = s.delta_pair || [];
  set('#d-a', pair[0]); set('#d-b', pair[1]);
  const c = s.commentators || [];
  set('#c-n1', c[0] && c[0].name); set('#c-r1', c[0] && c[0].role);
  set('#c-n2', c[1] && c[1].name); set('#c-r2', c[1] && c[1].role);
  set('#c-cap', s.comm_caption);
  if(tab === 'broadcast' && !locked()) renderView();      // вкл/выкл и выбор — из настроек
}

// поля формы выбранного оверлея: id поля -> [ключ настройки, число по умолчанию]
const FIELDS = {
  tower: [['b-title', 'tower_title'], ['b-top', 'tower_top', 10], ['b-win', 'tower_window', 8], ['b-focus', 'focus_car']],
  grid: [['g-title', 'grid_title'], ['g-rows', 'grid_rows', 24]],
  pits: [['p-title', 'pits_title'], ['p-rows', 'pits_rows', 12]],
};
async function saveOv(id){
  const body = {};
  for(const [el, k, def] of FIELDS[id] || []){
    const v = ($('#' + el) || {}).value || '';
    body[k] = def ? (Number(v) || def) : k === 'focus_car' ? v.replace('#', '').trim() : v;
  }
  const r = await post('/api/broadcast/settings', body);
  if(r.ok) toast('Настройки применены', 'ok');
}
// выбор и вкл/выкл в настройках применяются сразу
async function saveSetting(k, v){
  bset[k] = v; renderView();
  const r = await post('/api/broadcast/settings', {[k]: v});
  if(r.ok) toast('Применено', 'ok');
}
irc.on('seg', (key, v) => { if(key.startsWith('bs:')) saveSetting(key.slice(3), v); });
document.addEventListener('click', e => { const b = e.target.closest('[data-bsfx]'); if(b) saveSetting('replay_fx', b.dataset.bsfx); });

async function saveDelta(){
  // поле принимает и номер, и фамилию — номер вытаскиваем через общий поиск
  const resolve = async v => {
    v = (v || '').trim();
    if(!v) return '';
    const list = await irc.get('/api/drivers?q=' + encodeURIComponent(v)) || [];
    return list.length ? list[0].car_number : v.replace('#','');
  };
  const pair = [await resolve($('#d-a').value), await resolve($('#d-b').value)].filter(Boolean);
  const r = await post('/api/broadcast/settings', {delta_pair: pair});
  if(r.ok) toast(pair.length === 2 ? `Пара: #${pair[0]} и #${pair[1]}` : 'Укажите обоих пилотов',
                 pair.length === 2 ? 'ok' : 'er');
  loadBroadcast();
}

async function showComm(visible){
  const people = [
    {name: $('#c-n1').value, role: $('#c-r1').value},
    {name: $('#c-n2').value, role: $('#c-r2').value},
  ];
  const r = await post('/api/broadcast/commentators', {people, visible, caption: $('#c-cap').value});
  if(r.ok){ toast(visible ? 'Плашка в эфире' : 'Плашка скрыта', visible ? 'er' : ''); refresh(); }
}

function copyUrl(name, direct){
  const url = direct ? (state.lan_url || location.origin + '/') + direct
                     : location.origin + '/ov/' + name;
  navigator.clipboard.writeText(url)
    .then(() => toast('Скопировано: ' + url, 'ok'))
    .catch(() => toast('Не удалось скопировать', 'er'));
}

/* ======================= состояние ======================= */

async function loadEvents(){
  const list = await irc.get('/api/events?limit=60');
  if(!Array.isArray(list)) return;
  events = list;
  if(tab === 'overview' && !locked()) renderView();
}
setInterval(() => { if(tab === 'overview') loadEvents(); }, 5000);

function apply(st){
  // видимость оверлеев и окон приходит внутри статусов модулей — поднимаем наверх
  const bc = (st.modules || []).find(m => m.id === 'broadcast');
  st.overlays = (bc && bc.overlays) || [];
  st.deck_visible = !!(bc && bc.deck_visible);
  const rcm = (st.modules || []).find(m => m.id === 'racecontrol');
  st.overlay_visible = !!(rcm && rcm.overlay_visible);
  state = st;
  irc.rc.setState(st);
  irc.deck.setState(st);
  renderTop(st);
  renderLock();
  renderView();
}
async function refresh(){
  const st = await irc.get('/api/state');
  if(st) apply(st);
}
refresh();
loadEvents();

irc.rc.init({
  draw: () => { if(tab === 'racecontrol' && !locked()) renderView(); },
  active: () => tab === 'racecontrol' && !locked() && !!(mod('racecontrol') || {}).started,
});

irc.deck.init({
  draw: () => { if(tab === 'broadcast' && !locked()) renderView(); },
  active: () => tab === 'broadcast' && bcMode === 'live' && !locked(),
  airActive: () => tab === 'broadcast' && !locked(),
  side: deckSide,
});

const es = new EventSource('/api/stream');
es.addEventListener('state', e => apply(JSON.parse(e.data)));
es.addEventListener('incidents', e => irc.rc.setIncidents(JSON.parse(e.data)));
es.addEventListener('rc_live', e => irc.rc.setLive(JSON.parse(e.data)));
