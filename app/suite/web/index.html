<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Токены ichamps — static/css/racing.css, тема data-theme="dark" */
  :root{
    --bg:#0B0E14; --surface:#141923; --surface-2:#1B2230; --surface-3:#232C3D;
    --line:#28303F; --line-strong:#3A4456;
    --fg:#EAEEF5; --dim:#9AA6B8; --light:#6B7689;
    --accent:#FF5A1F; --accent-hover:#E14A12;
    --live:#22C55E; --replay:#F59E0B; --off:#6B7689;
    --est:#A78BFA; --hit:#EF4444; --offtrack:#38BDF8;
    --radius:.75rem; --shadow:0 8px 30px -12px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 'Inter','Manrope','Segoe UI',system-ui,sans-serif}
  a{color:var(--accent);text-decoration:none}

  /* ---------- шапка ---------- */
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;
         background:var(--surface);border-bottom:1px solid var(--line);
         position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:.6rem;font-family:'Rubik','Inter',sans-serif;
         font-weight:700;letter-spacing:.3px;font-size:15px}
  .brand{text-decoration:none}
  .brand .logo{height:26px;display:block}
  .pill{padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;
        text-transform:uppercase;letter-spacing:.6px}
  .pill.LIVE{background:rgba(34,197,94,.14);color:var(--live);
             box-shadow:inset 0 0 0 1px rgba(34,197,94,.38)}
  .pill.REPLAY{background:rgba(245,158,11,.14);color:var(--replay);
               box-shadow:inset 0 0 0 1px rgba(245,158,11,.38)}
  .pill.OFFLINE{background:rgba(107,118,137,.14);color:var(--off);
                box-shadow:inset 0 0 0 1px rgba(107,118,137,.38)}
  .meta{color:var(--dim);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
  .spacer{flex:1}
  .ver{color:var(--light);font-size:12px}

  /* ---------- каркас ---------- */
  .wrap{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 57px)}
  nav{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px}
  .navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
           cursor:pointer;color:var(--dim);font-weight:500}
  .navitem:hover{background:var(--surface-2);color:var(--fg)}
  .navitem.active{background:var(--surface-3);color:var(--fg)}
  .navitem .dot{width:8px;height:8px;border-radius:50%;background:var(--off);flex:none}
  .navitem.on .dot{background:var(--live)}
  .navitem .soon{margin-left:auto;font-size:10px;color:var(--light);
                 text-transform:uppercase;letter-spacing:.5px}
  main{padding:22px 26px;max-width:1100px}
  h1{font-family:'Rubik','Inter',sans-serif;font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}

  /* ---------- карточки модулей ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px 18px}
  .card h3{font-family:'Rubik','Inter',sans-serif;margin:0 0 6px;font-size:15px;
           display:flex;align-items:center;gap:8px}
  .card p{color:var(--dim);font-size:13px;margin:0 0 14px;min-height:38px}
  .card .row{display:flex;align-items:center;gap:10px}
  .state{font-size:12px;color:var(--dim)}
  .state b{color:var(--live)}
  .state.off b{color:var(--off)}
  .err{color:var(--hit);font-size:12px;margin-top:8px}

  /* ---------- переключатель ---------- */
  .sw{position:relative;width:44px;height:24px;flex:none;border-radius:999px;
      background:var(--surface-3);cursor:pointer;transition:background .15s}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
             border-radius:50%;background:var(--light);transition:.15s}
  .sw.on{background:rgba(255,90,31,.3)}
  .sw.on::after{left:23px;background:var(--accent)}
  .sw.busy{opacity:.5;pointer-events:none}

  button{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);
         border-radius:10px;padding:7px 14px;cursor:pointer;font:inherit;font-size:13px}
  button:hover{background:var(--surface-3)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button.primary:hover{background:var(--accent-hover)}

  .empty{color:var(--dim);padding:40px 0;text-align:center}
  .kv{display:grid;grid-template-columns:190px 1fr;gap:8px 16px;font-size:13px}
  .kv div:nth-child(odd){color:var(--dim)}
  .kv input[type=text], .kv input:not([type]), .kv input[type=number], .kv select{
    width:100%;background:var(--surface-2);color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}
  .kv input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
  .ovrow{display:flex;align-items:center;gap:10px;padding:6px 0;
         border-top:1px solid var(--line)}
  .ovrow .ovname{width:190px;font-size:13px}
  .ovrow code{flex:1}
  code{background:var(--surface-2);padding:2px 6px;border-radius:6px;font-size:12px}
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--surface);border:1px solid var(--line);
         border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;
         max-width:340px;font-size:13px;box-shadow:var(--shadow)}
  .toast.err{border-left-color:var(--hit)}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/assets/logo.png" alt="iRC" class="logo"></a>
  <div class="pill OFFLINE" id="mode">offline</div>
  <div class="meta">
    <span id="track">сим не найден</span>
    <span id="clock"></span>
    <span id="drivers"></span>
  </div>
  <div class="spacer"></div>
  <div class="ver" id="ver"></div>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
let state = {modules: []};
let tab = 'overview';

const MODULES = {
  racecontrol: {title:'Рейс-контрол',
    desc:'Лента инцидентов, перемотка повтора к эпизоду, жёлтые и чёрные флаги.'},
  broadcast:   {title:'Оверлеи трансляции',
    desc:'Башня позиций, стартовая решётка, плашка комментаторов, пит-стопы.'},
  rutp:        {title:'RUTP',
    desc:'Ливреи Trading Paints. Внешний агент — iRC им только управляет.'},
  telemetry:   {title:'Телеметрия',
    desc:'Сбор покруговых сводок команды: топливо, пит, резина.'},
};

function toast(text, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = text;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

async function post(url, body){
  try{
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                                body: JSON.stringify(body || {})});
    const res = await r.json();
    if(res && res.ok === false) toast(res.message || 'Не выполнено', 'err');
    return res;
  }catch(e){
    toast('Нет связи с приложением', 'err');
    return {ok:false};
  }
}

function fmtTime(s){
  s = Math.max(0, s|0);
  return [s/3600|0, s%3600/60|0, s%60].map(v => String(v).padStart(2,'0')).join(':');
}

function renderHeader(st){
  const m = $('#mode');
  m.className = 'pill ' + st.mode;
  m.textContent = st.mode;
  $('#track').textContent = st.connected ? (st.track || 'сессия') : 'сим не найден';
  $('#clock').textContent = st.connected ? fmtTime(st.session_time) : '';
  $('#drivers').textContent = st.connected ? `${st.drivers} пилотов` : '';
  $('#ver').textContent = 'v' + st.version;
}

function renderNav(){
  const items = Object.entries(MODULES).map(([id, m]) => {
    const st = state.modules.find(x => x.id === id);
    const known = !!st;
    return `<div class="navitem ${tab===id?'active':''} ${st && st.started?'on':''}"
                 data-tab="${id}">
              <span class="dot"></span>${m.title}
              ${known ? '' : '<span class="soon">позже</span>'}
            </div>`;
  }).join('');
  $('#nav').innerHTML =
    `<div class="navitem ${tab==='overview'?'active':''}" data-tab="overview">
       <span class="dot" style="background:var(--accent)"></span>Обзор</div>
     <div style="height:10px"></div>${items}`;
}

function moduleCard(id){
  const meta = MODULES[id];
  const st = state.modules.find(x => x.id === id);
  if(!st){
    return `<div class="card"><h3>${meta.title}</h3><p>${meta.desc}</p>
            <div class="state off">Модуль ещё не реализован</div></div>`;
  }
  return `<div class="card">
    <h3>${meta.title}</h3>
    <p>${meta.desc}</p>
    <div class="row">
      <div class="sw ${st.started?'on':''}" data-toggle="${id}"></div>
      <div class="state ${st.started?'':'off'}">
        <b>${st.started ? 'включён' : 'выключен'}</b>
      </div>
      ${st.started && id==='racecontrol'
        ? `<div class="spacer"></div><div class="state">инцидентов: ${st.incidents ?? 0}</div>` : ''}
    </div>
    ${st.error ? `<div class="err">${st.error}</div>` : ''}
  </div>`;
}

function renderView(){
  if(tab === 'overview'){
    $('#view').innerHTML = `
      <h1>Обзор</h1>
      <div class="sub">Модули включаются независимо и делят один клиент iRacing.</div>
      <div class="cards">${Object.keys(MODULES).map(moduleCard).join('')}</div>`;
    return;
  }
  const meta = MODULES[tab];
  const st = state.modules.find(x => x.id === tab);
  if(!st){
    $('#view').innerHTML = `<h1>${meta.title}</h1>
      <div class="sub">${meta.desc}</div>
      <div class="empty">Модуль ещё не реализован — см. ТЗ, этапы работ.</div>`;
    return;
  }
  if(tab === 'broadcast'){
    const OV = [
      ['tower','Башня позиций'], ['grid','Стартовая решётка'],
      ['commentators','Плашка комментаторов'], ['delta','Дельта пилотов'],
      ['pits','Пит-стопы'],
    ];
    const links = OV.map(([id,title]) => `
      <div class="ovrow">
        <div class="ovname">${title}</div>
        <code>/ov/${id}</code>
        <button onclick="copyUrl('${id}')">копировать</button>
        <button onclick="window.open('/ov/${id}','_blank')">открыть</button>
      </div>`).join('');

    $('#view').innerHTML = `
      <h1>${meta.title}</h1><div class="sub">${meta.desc}</div>
      <div class="cards">
        <div class="card" style="grid-column:1/-1">
          <h3>Модуль</h3>
          <div class="row">
            <div class="sw ${st.started?'on':''}" data-toggle="broadcast"></div>
            <div class="state ${st.started?'':'off'}"><b>${st.started?'включён':'выключен'}</b></div>
            ${st.started ? `<div class="spacer"></div><div class="state">машин в кадре: ${st.cars ?? 0}</div>` : ''}
          </div>
          <div style="height:14px"></div>
          <div class="state">Добавь адрес в OBS как <b>browser source</b> — фон прозрачный,
            размер и место задаёт сам OBS:</div>
          <div style="height:8px"></div>
          ${links}
          <div style="height:16px"></div>
          <h3>Пульт эфира</h3>
          <div class="state">Управлять графикой можно тремя способами: пультом
            поверх сима, окном на втором мониторе или с телефона.</div>
          <div style="height:10px"></div>
          <div class="ovrow">
            <div class="ovname">Пульт (окно/телефон)</div>
            <code>/deck</code>
            <button onclick="copyUrl('','deck')">копировать</button>
            <button onclick="window.open('/deck','_blank')">открыть</button>
          </div>
          <div style="height:12px"></div>
          <div class="row">
            <div class="sw ${state.allow_lan?'on':''}" onclick="toggleLan()"></div>
            <div class="state">Доступ с телефона${state.lan_url
              ? `: <code>${state.lan_url}deck</code>` : ' (выключен)'}</div>
          </div>
          <div class="state" style="margin-top:8px">Пульт в своей сети открыт
            без пароля — включай в домашней сети, не в открытом Wi-Fi.</div>
        </div>

        <div class="card">
          <h3>Башня позиций</h3>
          <div class="kv">
            <div>Заголовок</div><div><input id="b-title" placeholder="позиции"></div>
            <div>Строк в кадре</div><div><input id="b-rows" type="number" min="3" max="40"></div>
            <div>Гэп считать</div><div>
              <select id="b-gap">
                <option value="leader">до лидера</option>
                <option value="ahead">до впереди идущего</option>
              </select></div>
            <div>Держать в кадре #</div><div><input id="b-focus" placeholder="номер"></div>
            <div>Показывать питы</div><div><input id="b-pits" type="checkbox"></div>
          </div>
          <div style="height:12px"></div>
          <button class="primary" onclick="saveBroadcast()">Применить</button>
        </div>

        <div class="card">
          <h3>Стартовая решётка</h3>
          <div class="kv">
            <div>Заголовок</div><div><input id="g-title"></div>
            <div>Строк</div><div><input id="g-rows" type="number" min="2" max="60"></div>
          </div>
          <div style="height:10px"></div>
          <div class="state">Берётся из результатов квалификации. Если её не было —
            покажет текущий порядок и honest-подпись об этом.</div>
          <div style="height:12px"></div>
          <button class="primary" onclick="saveBroadcast()">Применить</button>
        </div>

        <div class="card">
          <h3>Плашка комментаторов</h3>
          <div class="kv">
            <div>Первый</div><div><input id="c-n1" placeholder="имя"></div>
            <div>Роль</div><div><input id="c-r1" placeholder="комментатор"></div>
            <div>Второй</div><div><input id="c-n2" placeholder="имя"></div>
            <div>Роль</div><div><input id="c-r2" placeholder="эксперт"></div>
            <div>Подпись справа</div><div><input id="c-cap" placeholder="в эфире"></div>
          </div>
          <div style="height:12px"></div>
          <div class="row">
            <button class="primary" onclick="showComm(true)">Показать</button>
            <button onclick="showComm(false)">Скрыть</button>
            <div class="spacer"></div>
            <div class="state" id="c-state"></div>
          </div>
        </div>

        <div class="card">
          <h3>Дельта пилотов</h3>
          <div class="kv">
            <div>Первый №</div><div><input id="d-a" placeholder="номер или фамилия"></div>
            <div>Второй №</div><div><input id="d-b" placeholder="номер или фамилия"></div>
          </div>
          <div style="height:10px"></div>
          <div class="state">Разрыв считается по оценке сима (F2Time): на разорванном
            поле точность хуже секунды.</div>
          <div style="height:12px"></div>
          <button class="primary" onclick="saveDelta()">Применить</button>
        </div>

        <div class="card">
          <h3>Пит-стопы</h3>
          <div class="kv">
            <div>Заголовок</div><div><input id="p-title"></div>
            <div>Строк</div><div><input id="p-rows" type="number" min="3" max="40"></div>
            <div>Показывать всех</div><div><input id="p-all" type="checkbox"></div>
          </div>
          <div style="height:10px"></div>
          <div class="state">Остановка считается по въезду в бокс: проезд по пит-лейну
            насквозь не в счёт.</div>
          <div style="height:12px"></div>
          <button class="primary" onclick="saveBroadcast()">Применить</button>
        </div>
      </div>`;
    loadBroadcast();
    return;
  }
  if(tab === 'racecontrol'){
    $('#view').innerHTML = `
      <h1>${meta.title}</h1><div class="sub">${meta.desc}</div>
      <div class="cards"><div class="card">
        <h3>Состояние</h3>
        <div class="kv">
          <div>Модуль</div><div>${st.started ? 'включён' : 'выключен'}</div>
          <div>Инцидентов в ленте</div><div>${st.incidents ?? 0}</div>
          <div>Кругов под жёлтым</div><div>${st.pace_laps ?? '—'}</div>
          <div>Оверлей поверх сима</div><div>${
            !st.overlay_available ? 'выключен в настройках'
              : (st.overlay_visible ? 'показан' : 'скрыт')}</div>
        </div>
        <div style="height:14px"></div>
        <div class="row">
          <div class="sw ${st.started?'on':''}" data-toggle="racecontrol"></div>
          <button class="primary" onclick="toggleRcOverlay(${st.overlay_visible ? 'false' : 'true'})">
            ${st.overlay_visible ? 'Скрыть оверлей' : 'Показать оверлей'}</button>
          <button onclick="window.open('/racecontrol','_blank')">Веб-панель</button>
        </div>
        <div class="state" style="margin-top:10px">
          Оверлей — окно поверх iRacing. Веб-панель нужна для второго монитора
          или стюарда на другой машине.</div>
      </div></div>`;
    return;
  }
  $('#view').innerHTML = `<h1>${meta.title}</h1><div class="sub">${meta.desc}</div>
    <div class="cards">${moduleCard(tab)}</div>`;
}

document.addEventListener('click', async e => {
  const nav = e.target.closest('.navitem');
  if(nav){ tab = nav.dataset.tab; renderNav(); renderView(); return; }
  const sw = e.target.closest('.sw');
  if(sw){
    const id = sw.dataset.toggle;
    const on = sw.classList.contains('on');
    sw.classList.add('busy');
    const r = await post('/api/modules/set', {id, enabled: !on});
    if(r.ok) toast(`${MODULES[id].title}: ${!on ? 'включён' : 'выключен'}`);
    sw.classList.remove('busy');
    refresh();
  }
});

async function toggleRcOverlay(visible){
  const r = await post('/api/racecontrol/overlay', {visible});
  if(r.ok) toast(visible ? 'Оверлей показан' : 'Оверлей скрыт');
  setTimeout(refresh, 400);
}

async function toggleLan(){
  const r = await post('/api/lan', {allow: !state.allow_lan});
  if(r.ok) toast(r.allow_lan
    ? 'Доступ с телефона включён — перезапусти iRC, чтобы применилось'
    : 'Доступ с телефона выключен — нужен перезапуск');
  refresh();
}

async function loadBroadcast(){
  try{
    const s = await (await fetch('/api/broadcast/settings')).json();
    const set = (id, v) => { const el = $(id); if(el) el.value = v ?? ''; };
    const chk = (id, v) => { const el = $(id); if(el) el.checked = !!v; };
    set('#b-title', s.tower_title); set('#b-rows', s.tower_rows);
    set('#b-gap', s.gap_mode); set('#b-focus', s.focus_car);
    chk('#b-pits', s.show_pits);
    set('#g-title', s.grid_title); set('#g-rows', s.grid_rows);
    set('#p-title', s.pits_title); set('#p-rows', s.pits_rows);
    chk('#p-all', s.pits_show_all);
    const pair = s.delta_pair || [];
    set('#d-a', pair[0]); set('#d-b', pair[1]);
    const c = s.commentators || [];
    set('#c-n1', c[0] && c[0].name); set('#c-r1', c[0] && c[0].role);
    set('#c-n2', c[1] && c[1].name); set('#c-r2', c[1] && c[1].role);
    set('#c-cap', s.comm_caption);
    const st = $('#c-state');
    if(st) st.textContent = s.comm_visible ? 'в эфире' : 'скрыта';
  }catch(e){}
}

async function saveBroadcast(){
  const num = (id, def) => Number($(id) && $(id).value) || def;
  const r = await post('/api/broadcast/settings', {
    tower_title: $('#b-title').value,
    tower_rows: num('#b-rows', 12),
    gap_mode: $('#b-gap').value,
    focus_car: $('#b-focus').value.replace('#','').trim(),
    show_pits: $('#b-pits').checked,
    grid_title: $('#g-title').value,
    grid_rows: num('#g-rows', 24),
    pits_title: $('#p-title').value,
    pits_rows: num('#p-rows', 12),
    pits_show_all: $('#p-all').checked,
  });
  if(r.ok) toast('Настройки применены');
}

async function saveDelta(){
  // поле принимает и номер, и фамилию — номер вытаскиваем через общий поиск
  const resolve = async v => {
    v = (v || '').trim();
    if(!v) return '';
    const list = await (await fetch('/api/drivers?q=' + encodeURIComponent(v))).json();
    return list.length ? list[0].car_number : v.replace('#','');
  };
  const pair = [await resolve($('#d-a').value), await resolve($('#d-b').value)]
    .filter(Boolean);
  const r = await post('/api/broadcast/settings', {delta_pair: pair});
  if(r.ok) toast(pair.length === 2 ? `Пара: #${pair[0]} и #${pair[1]}`
                                   : 'Укажи обоих пилотов', pair.length===2?'':'err');
  loadBroadcast();
}

async function showComm(visible){
  const people = [
    {name: $('#c-n1').value, role: $('#c-r1').value},
    {name: $('#c-n2').value, role: $('#c-r2').value},
  ];
  const r = await post('/api/broadcast/commentators',
                       {people, visible, caption: $('#c-cap').value});
  if(r.ok){
    toast(visible ? 'Плашка в эфире' : 'Плашка скрыта');
    const st = $('#c-state'); if(st) st.textContent = visible ? 'в эфире' : 'скрыта';
  }
}

function copyUrl(name, direct){
  const url = direct ? (state.lan_url || location.origin + '/') + direct
                     : location.origin + '/ov/' + name;
  navigator.clipboard.writeText(url)
    .then(() => toast('Скопировано: ' + url))
    .catch(() => toast('Не удалось скопировать', 'err'));
}

function apply(st){ state = st; renderHeader(st); renderNav(); renderView(); }
async function refresh(){
  try{ apply(await (await fetch('/api/state')).json()); }catch(e){}
}
refresh();

const es = new EventSource('/api/stream');
es.addEventListener('state', e => apply(JSON.parse(e.data)));
</script>
</body>
</html>
