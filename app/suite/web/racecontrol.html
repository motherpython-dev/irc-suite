<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/icon.png" sizes="any">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRC · Рейс-контроль</title>
<link rel="stylesheet" href="/ui/irc.css">
<style>
  /* Отдельное окно рейс-контроля — второй монитор или стюард на другой машине.
     Содержимое то же, что во вкладке главного окна: рисует /ui/rc.js. */
  .content{display:block;overflow:hidden}
  .pg{height:100%;display:grid;gap:8px;min-height:0}
  .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tab{cursor:default}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="/" title="главное окно"><img src="/assets/logo.png" alt="iRC"></a>
    <span class="tab" aria-current="page">Рейс-контроль</span>
    <span class="grow"></span>
  </header>
  <main class="content" id="view"></main>
  <footer class="status" id="status"></footer>
</div>

<script src="/ui/irc.js"></script>
<script src="/ui/rc.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = irc.esc;
let state = null;

const pad = v => String(v).padStart(2, '0');
const fmtTime = s => { s = Math.max(0, s|0); return `${pad(s/3600|0)}:${pad(s%3600/60|0)}:${pad(s%60)}`; };
const rcMod = () => (state && (state.modules || []).find(m => m.id === 'racecontrol')) || null;

function draw(){
  const m = rcMod();
  irc.setHTML($('#view'), m && m.started ? irc.rc.html()
    : `<div class="pg" data-key="off"><section class="p" style="align-self:start"><div class="ph">Рейс-контроль<span class="r">выключен</span></div>
        <div class="pb dim">${state ? 'Модуль выключен — включите его в главном окне программы.' : 'Нет связи с программой — она запущена?'}</div></section></div>`);
}

function renderTop(st){
  const live = (rcMod() || {}).live;
  const s = [];
  if(live && live.stage) s.push(`<span class="s ok ell">этап · ${esc(live.stage.championship)} · ${esc(live.stage.title)}</span>`);
  else if(live) s.push('<span class="s">этап не привязан</span>');
  if(live && live.pending) s.push(`<span class="s wa">решений ждут отправки: ${live.pending}</span>`);
  if(live && live.offline) s.push('<span class="s wa">нет связи с сайтом</span>');
  if(st.connected) s.push(st.results_available ? '<span class="s ok">видно всё поле</span>'
                                             : '<span class="s wa">тест-драйв: только свои инциденты</span>');
  s.push(irc.simStatus(st));
  s.push(`<span class="grow"></span><span>iRC v${esc(st.version || '')}</span>`);
  irc.setHTML($('#status'), s.join(''));
}

function apply(st){
  state = st;
  irc.rc.setState(st);
  renderTop(st);
  draw();
}

irc.rc.init({draw, active: () => !!(rcMod() || {}).started});
irc.get('/api/state').then(st => st ? apply(st) : draw());

const es = new EventSource('/api/stream');
es.addEventListener('state', e => apply(JSON.parse(e.data)));
es.addEventListener('incidents', e => irc.rc.setIncidents(JSON.parse(e.data)));
es.addEventListener('rc_live', e => irc.rc.setLive(JSON.parse(e.data)));
</script>
</body>
</html>
