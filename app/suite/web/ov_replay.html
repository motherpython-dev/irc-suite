<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>iRC — шторка повтора</title>
<!-- Шторка повтора и метка «ПОВТОР» для OBS (browser source 1920×1080, прозрачный фон).
     Один файл на два адреса: /ov/replayfx — шторка, /ov/replaybug — метка. Анимации — те
     же, что в мокапе docs/mockups/replay-fx.html и в окнах поверх сима (core/ui/fx_paint.py);
     фазу шторки даёт режиссёр: /api/broadcast/fx. -->
<style>
@font-face{font-family:'Exo 2';src:url('/ui/fonts/Exo2.ttf') format('truetype');font-weight:100 900}
:root{--acc:#FF5A1F;--fg:#EAEEF5;--dim:#8E8E98;--air:#FF2D2D}
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh;font-family:'Exo 2',sans-serif;color:var(--fg)}
.fx .mid img{width:16vw;height:auto;filter:drop-shadow(0 0 1.4vw rgba(255,90,31,.35))}
/* метка «повтор» в углу, пока идёт повтор */
.bug{position:absolute;right:2.2vw;top:3.4vw;display:flex;align-items:center;gap:.9vw;height:3vw;padding:0 1.3vw 0 1vw;border-radius:.45vw;
     background:linear-gradient(180deg,rgba(30,22,24,.96),rgba(16,20,28,.94));box-shadow:0 .6vw 1.6vw rgba(0,0,0,.45);opacity:0;transform:translateY(-.8vw);transition:.35s}
.bug.on{opacity:1;transform:none}
.bug::before{content:"";position:absolute;left:0;top:.6vw;bottom:.6vw;width:.25vw;border-radius:0 .2vw .2vw 0;background:var(--acc)}
.bug .ic{font:900 1.2vw 'Exo 2';color:var(--acc);letter-spacing:-.1em}
.bug .t{font:800 1.15vw 'Exo 2';letter-spacing:.2em}
.bug .pl{width:3.3vw;height:1.9vw;border-radius:.3vw;display:grid;place-items:center;font:italic 900 1.2vw 'Exo 2';background:linear-gradient(90deg,#51127F,#20F3BA);text-shadow:0 1px 2px rgba(0,0,0,.8)}
.bug .nm{font:800 1.1vw 'Exo 2';letter-spacing:.08em;color:#C3C9D3}
.bug .lv{font:800 1.15vw 'Exo 2';letter-spacing:.2em;color:#fff;display:none}
.bug.live .ic,.bug.live .t,.bug.live .pl,.bug.live .nm{display:none}
.bug.live .lv{display:block}
.bug.live::before{background:var(--air)}
.bug.live .lv::before{content:"● ";color:var(--air)}

/* общий центр шторки: логотип и слово */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1.2vw;opacity:0}
.fx .mid svg{width:16vw;height:auto;filter:drop-shadow(0 0 1.4vw rgba(255,90,31,.35))}
.fx .mid .w{font:800 2vw 'Exo 2';letter-spacing:.5em;padding-left:.5em;color:#fff}
.fx .mid .w.lv::before{content:"● ";color:var(--air)}

/* A — шеврон: оранжевая полоса со скосом проходит слева направо, за ней — графит */
.A .band{position:absolute;top:-10%;bottom:-10%;left:0;width:160%;transform:translateX(-110%) skewX(-18deg)}
.A .band.o{background:linear-gradient(90deg,#FF5A1F,#ff8a4c);z-index:1}
.A .band.d{background:linear-gradient(180deg,#19161B,#101217);z-index:2}
.A.in .band.o{animation:aIn .5s cubic-bezier(.7,0,.3,1) forwards}
.A.in .band.d{animation:aIn .5s .08s cubic-bezier(.7,0,.3,1) forwards}
.A.cover .band{transform:translateX(-25%) skewX(-18deg)}
.A.out .band.d{animation:aOut .5s cubic-bezier(.7,0,.3,1) forwards;transform:translateX(-25%) skewX(-18deg)}
.A.out .band.o{animation:aOut .5s .08s cubic-bezier(.7,0,.3,1) forwards;transform:translateX(-25%) skewX(-18deg)}
@keyframes aIn{from{transform:translateX(-110%) skewX(-18deg)}to{transform:translateX(-25%) skewX(-18deg)}}
@keyframes aOut{from{transform:translateX(-25%) skewX(-18deg)}to{transform:translateX(75%) skewX(-18deg)}}
.A .mid{z-index:3}

/* B — ламели: горизонтальные пластины въезжают с чередующихся сторон. Светится
   только передний (торцевой) край пластины, пока она едет; сомкнулись — свечение
   гаснет, линий поперёк кадра нет, и только потом проявляется логотип */
.B .sl{position:absolute;left:0;right:0;background:#141519}
.B .sl::after{content:"";position:absolute;top:0;bottom:0;width:.3vw;background:var(--acc);box-shadow:0 0 1.2vw var(--acc),0 0 .3vw #fff;opacity:0}
.B .sl.r::after{right:0} .B .sl.l::after{left:0}
.B.in .sl{animation:bIn .42s cubic-bezier(.7,0,.3,1) both}
.B.in .sl::after{animation:egIn .5s linear both;animation-delay:inherit}
.B.cover .sl{transform:none}
.B.out .sl{animation:bOut .42s cubic-bezier(.7,0,.3,1) both;animation-delay:var(--od)}
.B.out .sl::after{animation:egOut .45s linear both;animation-delay:var(--od)}
@keyframes bIn{from{transform:translateX(var(--from))}to{transform:none}}
@keyframes bOut{from{transform:none}to{transform:translateX(var(--to))}}

/* C — диафрагма: экран сжимается кругом к логотипу, кольцо светится */
.C .iris{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#1c1719 0,#101217 70%)}
.C .ring{position:absolute;left:50%;top:50%;width:150vw;height:150vw;border-radius:50%;transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 .5vw var(--acc),0 0 3vw var(--acc);opacity:0}
.C.in .iris{animation:cIn .55s cubic-bezier(.7,0,.3,1) forwards}
.C.cover .iris{clip-path:circle(120% at 50% 50%)}
.C.out .iris{animation:cOut .55s cubic-bezier(.7,0,.3,1) forwards}
.C.in .ring{animation:cRing .55s cubic-bezier(.7,0,.3,1) forwards}
.C.out .ring{animation:cRingO .55s cubic-bezier(.7,0,.3,1) forwards}
@keyframes cIn{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(120% at 50% 50%)}}
@keyframes cOut{from{clip-path:circle(120% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
@keyframes cRing{0%{opacity:1;transform:translate(-50%,-50%) scale(.02)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes cRingO{0%{opacity:0;transform:translate(-50%,-50%) scale(1)}20%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(.02)}}

/* D — скос: две панели сходятся по диагонали. Светятся только их края, пока
   панели едут; на встрече свечение гаснет, и лишь потом проявляется логотип —
   линия и логотип на экране вместе не бывают. При открытии наоборот: сначала
   уходит логотип, потом панели расходятся. Края — SVG по тем же точкам, что и
   край панелей: угол совпадает при любом размере кадра */
.D .pn{position:absolute;inset:-20%;background:#141519}
.D .pn.t{clip-path:polygon(0 0,100% 0,100% 30.4%,0 70.4%)}
.D .pn.b{clip-path:polygon(0 69.6%,100% 29.6%,100% 100%,0 100%)}
.D .eg{position:absolute;inset:-20%;width:140%;height:140%;overflow:visible;opacity:0}
.D .eg line{stroke:var(--acc);stroke-width:3;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 6px #FF5A1F) drop-shadow(0 0 2px #fff)}
.D.in .pn.t,.D.in .eg.t{animation:dT .5s cubic-bezier(.7,0,.3,1) forwards}
.D.in .pn.b,.D.in .eg.b{animation:dB .5s cubic-bezier(.7,0,.3,1) forwards}
.D.in .eg{animation-name:dT,egIn;animation-duration:.5s,.56s;animation-timing-function:cubic-bezier(.7,0,.3,1),linear;animation-fill-mode:forwards}
.D.in .eg.b{animation-name:dB,egIn}
.D.cover .pn,.D.cover .eg{transform:none}
.D.out .pn.t,.D.out .eg.t{animation:dT .5s .3s cubic-bezier(.7,0,.3,1) reverse both}
.D.out .pn.b,.D.out .eg.b{animation:dB .5s .3s cubic-bezier(.7,0,.3,1) reverse both}
.D.out .eg{animation-name:dT,egOut;animation-duration:.5s,.5s;animation-delay:.3s,.3s;animation-direction:reverse,normal;animation-fill-mode:both}
.D.out .eg.b{animation-name:dB,egOut}
@keyframes dT{from{transform:translate(-30%,-60%)}to{transform:none}}
@keyframes dB{from{transform:translate(30%,60%)}to{transform:none}}
@keyframes egIn{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes egOut{0%{opacity:0}20%{opacity:1}85%{opacity:1}100%{opacity:0}}
/* логотип у скоса — только когда свечение уже погасло */
.fx.B.in .mid,.fx.D.in .mid{animation:none;opacity:0}
.fx.B.cover .mid,.fx.D.cover .mid{animation:midLate .35s .1s both}
@keyframes midLate{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}

/* слово и логотип: появляются под конец закрытия, уходят в начале открытия */
.fx.in .mid{animation:midIn .5s forwards}
.fx.cover .mid{opacity:1}
.fx.out .mid{animation:midOut .3s forwards}
@keyframes midIn{0%,45%{opacity:0;transform:translate(-50%,-46%) scale(.96)}100%{opacity:1;transform:translate(-50%,-50%)}}
@keyframes midOut{from{opacity:1}to{opacity:0;transform:translate(-50%,-54%) scale(1.02)}}
</style></head><body>
<div class="fx" id="fx"></div>
<div class="bug" id="bug"><span class="ic">◀◀</span><span class="t">ПОВТОР</span><span class="pl" id="pl"></span><span class="nm" id="nm"></span><span class="lv">LIVE</span></div>
<script>
const PART = '__PART__';
const fx = document.getElementById('fx'), bug = document.getElementById('bug');
if(PART !== 'replaybug') bug.remove();
let key = '', cur = '';
function build(V, word){
  let inner = '';
  if(V === 'A') inner = '<div class="band o"></div><div class="band d"></div>';
  if(V === 'B') inner = Array.from({length: 8}, (_, i) => `<div class="sl ${i % 2 ? 'l' : 'r'}" style="top:${i * 12.5}%;height:12.6%;--from:${i % 2 ? '' : '-'}105%;--to:${i % 2 ? '-' : ''}105%;animation-delay:${i * 0.03}s;--od:${0.3 + i * 0.03}s"></div>`).join('');
  if(V === 'C') inner = '<div class="iris"></div><div class="ring"></div>';
  if(V === 'D'){ const ln = '<line x1="0" y1="70" x2="100" y2="30"/>';
    inner = `<div class="pn t"></div><div class="pn b"></div><svg class="eg t" viewBox="0 0 100 100" preserveAspectRatio="none">${ln}</svg><svg class="eg b" viewBox="0 0 100 100" preserveAspectRatio="none">${ln}</svg>`; }
  fx.innerHTML = inner + `<div class="mid"><img src="/assets/logo.png" alt=""><div class="w ${word === 'LIVE' ? 'lv' : ''}">${word}</div></div>`;
}
function applyFx(d){
  const k = d.n + ':' + d.phase;
  if(k === key) return;
  key = k;
  if(!d.phase){ fx.className = 'fx'; fx.innerHTML = ''; cur = ''; return; }
  if(d.phase === 'in' || !cur){ build(d.variant, d.word); cur = d.variant; }
  fx.className = 'fx ' + cur + ' ' + d.phase;
}
function applyBug(b){
  if(!b){ bug.classList.remove('on'); return; }
  bug.classList.toggle('live', b.mode === 'live');
  if(b.mode !== 'live'){
    const c = b.colors || [];
    const pl = document.getElementById('pl');
    pl.textContent = b.num;
    pl.style.background = c.length > 1 ? `linear-gradient(90deg,${c[0]},${c[1]})` : (c[0] || '#5C6370');
    const nm = String(b.name || '').split(' ').pop().toUpperCase();
    document.getElementById('nm').textContent = nm + (b.lap ? ' · КРУГ ' + b.lap : '');
  }
  bug.classList.add('on');
}
async function pull(){
  try{
    const d = await (await fetch('/api/broadcast/fx', {cache: 'no-store'})).json();
    if(PART === 'replaybug') applyBug(d.bug); else applyFx(d);
  }catch(e){}
}
setInterval(pull, PART === 'replaybug' ? 300 : 50);
pull();
</script></body></html>
