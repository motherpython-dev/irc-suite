<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/icon.png" sizes="any">
<title>iRC · редактор оверлеев</title>
<style>
  /* Холст-редактор оверлеев. В центре — настоящий оверлей (та же страница,
     что идёт в эфир) на живых данных; поверх него рамка выделения. Правки
     меняют JSON-описание и сразу подаются отрисовщику — видно то же, что
     уйдёт в эфир. «Сохранить» записывает описание на сервер, и открытые
     окна оверлеев подхватывают его за пару секунд. */
  :root{
    --bg:#0B0E14; --surface:#141923; --surface-2:#1A2130; --surface-3:#232C3D;
    --line:#28303F; --fg:#EAEEF5; --dim:#9AA6B8; --light:#6B7689;
    --accent:#FF5A1F; --sel:#38BDF8; --live:#22C55E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);
            font:13px/1.35 'Segoe UI',system-ui,sans-serif;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
  input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;
                        color:var(--fg);padding:5px 7px;font:inherit;min-width:0}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  input[type=color]{padding:1px;width:34px;height:28px;cursor:pointer}
  input[type=checkbox]{width:auto}

  .app{display:grid;grid-template-columns:230px 1fr 310px;grid-template-rows:50px 1fr;height:100vh}

  /* верхняя панель */
  .top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px;
       background:var(--surface);border-bottom:1px solid var(--line)}
  .top a.back{color:var(--dim);text-decoration:none;margin-right:6px}
  .top a.back:hover{color:#fff}
  .top .ttl{font-weight:600;font-size:14px;margin-right:10px}
  .tb{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 11px}
  .tb:hover{border-color:var(--light)}
  .tb:disabled{opacity:.4;cursor:default}
  .tb.on{border-color:var(--live);color:var(--live)}
  .tb.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .tb.pri.clean{background:var(--surface-3);border-color:var(--line);color:var(--dim)}
  .grow{flex:1}
  .status{color:var(--light);font-size:12px}

  /* левая колонка */
  .left{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:10px}
  .left h4,.right h4{font:600 10.5px/1 'Segoe UI';letter-spacing:.7px;text-transform:uppercase;
                     color:var(--dim);margin:12px 2px 7px}
  .left h4:first-child,.right h4:first-child{margin-top:2px}
  .ovbtn{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;color:var(--dim)}
  .ovbtn:hover{color:#fff;background:var(--surface-2)}
  .ovbtn.on{background:var(--surface-3);color:#fff}
  .sect{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .sect .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .sect .sh b{font-size:12px;color:var(--fg)}
  .sect .sh b.sel{color:var(--sel)}
  .adds{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
  .add{font-size:11.5px;padding:3px 7px;border:1px dashed var(--line);border-radius:6px;color:var(--dim)}
  .add:hover{color:#fff;border-color:var(--light)}
  .it{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;
      color:var(--dim);font-size:12.5px}
  .it:hover{background:var(--surface-2);color:#fff}
  .it.on{background:rgba(56,189,248,.14);color:#fff}
  .it .k{font-size:10px;color:var(--light);width:34px}

  /* холст */
  .stage{position:relative;overflow:auto;
         background-color:#1b1f27;
         background-image:linear-gradient(45deg,#232833 25%,transparent 25%),
                          linear-gradient(-45deg,#232833 25%,transparent 25%),
                          linear-gradient(45deg,transparent 75%,#232833 75%),
                          linear-gradient(-45deg,transparent 75%,#232833 75%);
         background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
  .wrap{position:absolute;left:40px;top:40px}
  #frame{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:transparent}
  #hit{position:absolute;inset:0;cursor:default}
  #hover,#selbox{position:absolute;pointer-events:none;display:none}
  #hover{outline:1px dashed rgba(56,189,248,.6)}
  #selbox{outline:1px solid var(--sel)}
  .h{position:absolute;width:9px;height:9px;background:#fff;border:1px solid var(--sel);
     pointer-events:auto;margin:-5px 0 0 -5px}
  .h[data-h=nw],.h[data-h=se]{cursor:nwse-resize}
  .h[data-h=ne],.h[data-h=sw]{cursor:nesw-resize}
  .h[data-h=n],.h[data-h=s]{cursor:ns-resize}
  .h[data-h=e],.h[data-h=w]{cursor:ew-resize}
  .tag{position:absolute;left:0;top:-20px;font-size:11px;white-space:nowrap;color:#fff;
       background:var(--sel);padding:1px 6px;border-radius:4px}
  .hint{position:absolute;right:14px;bottom:10px;color:var(--light);font-size:11.5px;
        background:rgba(11,14,20,.75);padding:5px 9px;border-radius:7px}

  /* правая колонка */
  .right{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:10px 12px 40px}
  .row{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin-bottom:6px}
  .row label{color:var(--dim);font-size:12px}
  .row .pair{display:flex;gap:5px;align-items:center}
  .row .pair>*{flex:1}
  .row .pair>input[type=color]{flex:none}
  .quad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
  .quad label{display:block;color:var(--light);font-size:10.5px;margin-bottom:2px}
  .quad input{width:100%}
  textarea{width:100%;resize:vertical;min-height:44px;font:12.5px Consolas,monospace}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .sbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 10px}
  .sbtn:hover{border-color:var(--light)}
  .sbtn.dng{color:#FF8B87}
  .note{color:var(--light);font-size:11.5px;margin:4px 0 8px}
  .assets{display:flex;flex-wrap:wrap;gap:6px}
  .asset{width:58px;height:44px;border:1px solid var(--line);border-radius:6px;background:#0d1016;
         display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .asset img{max-width:100%;max-height:100%}
  .asset.font{font-size:10px;color:var(--dim);padding:2px;text-align:center}

  #toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,170%);background:var(--surface-2);
         border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;
         padding:9px 14px;font-size:13px;transition:transform .2s;z-index:9}
  #toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="back" href="/">← Панель</a>
    <span class="ttl" id="ttl">Редактор оверлеев</span>
    <button class="tb" id="undo" title="Отменить (Ctrl+Z)">↶</button>
    <button class="tb" id="redo" title="Вернуть (Ctrl+Y)">↷</button>
    <select class="tb" id="zoom" title="Масштаб холста">
      <option value="1">100%</option><option value="1.5" selected>150%</option>
      <option value="2">200%</option><option value="3">300%</option>
    </select>
    <span class="grow"></span>
    <span class="status" id="status"></span>
    <button class="tb" id="demo" title="Синтетическая гонка, чтобы было что рисовать">Демо-данные</button>
    <button class="tb" id="air" title="Вывести этот оверлей в эфир поверх экрана">В эфир</button>
    <button class="tb pri clean" id="save" title="Сохранить (Ctrl+S)">Сохранено</button>
  </div>

  <div class="left" id="left"></div>

  <div class="stage" id="stage">
    <div class="wrap" id="wrap">
      <iframe id="frame" scrolling="no"></iframe>
      <div id="hit"></div>
      <div id="hover"></div>
      <div id="selbox"></div>
    </div>
    <div class="hint">клик — выбрать · тащить — двигать · углы — размер · стрелки — на 1 px (Shift — 10) ·
      Del — удалить · Ctrl+D — копия</div>
  </div>

  <div class="right" id="right"></div>
</div>
<div id="toast"></div>
<input type="file" id="file" hidden>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const OVS = [['tower', 'Башня позиций'], ['grid', 'Стартовая решётка'],
             ['commentators', 'Плашка комментаторов'], ['delta', 'Дельта пилотов'],
             ['pits', 'Пит-стопы']];
const SECT_LABEL = {header: 'Шапка', item: 'Строка', body: 'Блок', footer: 'Подвал',
                    tail: 'Подпись'};
const TYPE_LABEL = {text: 'Текст', chip: 'Чип', box: 'Плашка', image: 'Картинка'};

// Поля данных для вставки в шаблон — по оверлею и разделу.
const ROW = [['{position}', 'позиция'], ['{car_number}', 'номер машины'],
             ['{name|surname}', 'фамилия'], ['{name}', 'имя полностью'], ['{team}', 'команда'],
             ['{class_name}', 'класс'], ['{gap|gap}', 'отставание / ЛИДЕР']];
const FIELDS = {
  tower: {item: ROW.concat([['{lap}', 'круг'], ['{last_lap|laptime}', 'последний круг'],
                            ['{best_lap|laptime}', 'лучший круг'], ['{pit_stops}', 'пит-стопов']]),
          root: [['{$.lap}', 'круг лидера'], ['{$.laps_total|slash}', '/всего кругов'],
                 ['{$.track|upper}', 'трасса'], ['{$.title}', 'заголовок']]},
  grid: {item: [['{position}', 'место'], ['{car_number}', 'номер'], ['{name|surname}', 'фамилия'],
                ['{team|upper}', 'команда'], ['{class_name}', 'класс'], ['{time|laptime}', 'время квалы'],
                ['{delta|plus3}', 'отрыв от поула']],
         root: [['{$.title|upper}', 'заголовок'], ['{$.track|upper}', 'трасса'],
                ['{$.source|source_label}', 'источник'], ['{$.page}', 'страница'],
                ['{$.pages}', 'всего страниц'], ['{$.count}', 'всего машин']]},
  commentators: {item: [['{name|upper}', 'имя'], ['{role|upper}', 'роль']],
                 tail: [['{$.caption|upper}', 'подпись'], ['{$.caption}', 'подпись как есть']],
                 root: [['{$.caption}', 'подпись']]},
  delta: {body: [['{gap|fixed1}', 'разрыв'], ['{trend|trend}', 'тренд'],
                 ['{lead.position}', 'позиция впереди'], ['{lead.car_number}', 'номер впереди'],
                 ['{lead.name|surname}', 'фамилия впереди'], ['{chase.position}', 'позиция сзади'],
                 ['{chase.car_number}', 'номер сзади'], ['{chase.name|surname}', 'фамилия сзади'],
                 ['{laps_apart}', 'кругов между']],
          root: []},
  pits: {item: [['{position}', 'позиция'], ['{car_number}', 'номер'], ['{name|surname}', 'фамилия'],
                ['{count}', 'пит-стопов'], ['{last.duration|sec1}', 'последний пит'],
                ['{total}', 'всего на питах']],
         root: [['{$.title|upper}', 'заголовок']]},
};
const WHEN = [['', 'всегда'], ['leader', 'только у лидера'], ['!leader', 'кроме лидера'],
              ['in_pit', 'только на пит-лейне'], ['!in_pit', 'кроме пит-лейна'],
              ['focus', 'только у пилота в фокусе'], ['$.pages>1', 'если страниц больше одной']];
const FONT_SLOTS = [['num', 'Цифры (слот)'], ['text', 'Текст (слот)'], ['ui', 'Интерфейс (слот)']];
const SYS_FONTS = ['Bahnschrift SemiBold Condensed', 'Bahnschrift Condensed', 'Bahnschrift',
                   'Bahnschrift SemiBold', 'Segoe UI', 'Segoe UI Semibold', 'Arial', 'Arial Narrow',
                   'Arial Black', 'Impact', 'Tahoma', 'Verdana', 'Trebuchet MS', 'Consolas'];
const SHAPES = [['rect', 'прямоугольник'], ['round', 'скруглённая'], ['pill', 'капсула'],
                ['slant', 'параллелограмм'], ['slant-right', 'срез справа'], ['slant-left', 'срез слева']];
const ENTERS = [['left', 'слева'], ['right', 'справа'], ['up', 'снизу'], ['down', 'сверху'],
                ['fade', 'растворение']];

const S = {oid: 'tower', spec: null, savedJson: '', sel: null, zoom: 1.5,
           hist: [], fut: [], assets: [], air: false, demo: false};
const frame = $('#frame'), wrap = $('#wrap');

// ---------- мелочи ----------
let toastT;
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2000); }
async function api(url, body){
  const o = body !== undefined ? {method: 'POST', headers: {'Content-Type': 'application/json'},
                                  body: JSON.stringify(body)} : {};
  const r = await fetch(url, o);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
const clone = o => JSON.parse(JSON.stringify(o));
function getPath(o, p){ return p.split('.').reduce((a, k) => a == null ? undefined : a[k], o); }
function setPath(o, p, v){
  const ks = p.split('.'); let a = o;
  for(let i = 0; i < ks.length - 1; i++){ a[ks[i]] ??= {}; a = a[ks[i]]; }
  a[ks[ks.length - 1]] = v;
}

// ---------- описание ----------
function sectDef(sect){
  const sp = S.spec;
  return sect === 'header' ? sp.header : sect === 'footer' ? sp.footer
       : sect === 'item' ? sp.body.item : sect === 'body' ? sp.body
       : sect === 'tail' ? sp.body.tail : null;
}
function elems(sect){ const d = sectDef(sect); if(!d) return []; d.elements ??= []; return d.elements; }
function selEl(){ return S.sel ? elems(S.sel.sect).find(e => e.id === S.sel.id) : null; }
function sections(){
  const out = [];
  if(S.spec.header) out.push('header');
  out.push(S.spec.body.type === 'single' ? 'body' : 'item');
  if(S.spec.body.tail) out.push('tail');
  if(S.spec.footer) out.push('footer');
  return out;
}
function sectSize(sect){
  const d = sectDef(sect), sp = S.spec;
  const w = sect === 'tail' ? (d.width || 160)
          : sect === 'item' && sp.body.type === 'cards' ? (sp.body.item.width || 200)
          : sect === 'item' && sp.body.type === 'grid'
            ? Math.floor(((sp.width || 300) - (sp.body.gap || 0) * ((sp.body.columns || 1) - 1)) / (sp.body.columns || 1))
          : (sp.width || 300);
  const h = sect === 'body' ? (d.height || 100)
          : sect === 'tail' ? (sp.body.item.height || 40) : (d.height || 20);
  return {w, h};
}

// ---------- история ----------
function pushHist(){ S.hist.push(JSON.stringify(S.spec)); if(S.hist.length > 150) S.hist.shift(); S.fut = []; }
function undo(){ if(!S.hist.length) return; S.fut.push(JSON.stringify(S.spec));
  S.spec = JSON.parse(S.hist.pop()); fixSel(); refresh(); }
function redo(){ if(!S.fut.length) return; S.hist.push(JSON.stringify(S.spec));
  S.spec = JSON.parse(S.fut.pop()); fixSel(); refresh(); }
function fixSel(){ if(S.sel && !selEl()) S.sel = null; }
function change(fn){ pushHist(); fn(); refresh(); }

// ---------- отрисовка ----------
let rafPending = false;
function applySoon(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; applyToFrame(); drawPanels(false); });
}
function refresh(){ applyToFrame(); drawPanels(true); drawLeft(); markDirty(); }

function applyToFrame(){
  const w = frame.contentWindow;
  if(!w || !w.irOverlay) return;
  w.irOverlay.apply(Object.assign(clone(S.spec), {version: 'edit'}));
  setTimeout(fit, 30);
}
function fit(){
  const w = frame.contentWindow, doc = frame.contentDocument;
  const fr = w && w.irOverlay && w.irOverlay.frame();
  if(!fr) return;
  const r = fr.getBoundingClientRect();
  const W = Math.ceil(r.width) + 28, H = Math.ceil(r.height) + 28;
  frame.style.width = W + 'px'; frame.style.height = H + 'px';
  frame.style.transform = `scale(${S.zoom})`;
  wrap.style.width = W * S.zoom + 'px'; wrap.style.height = H * S.zoom + 'px';
  drawSel();
}
setInterval(() => { fit(); }, 700);   // строки меняются по ходу гонки — рамка следует

function nodeFor(sel){
  const doc = frame.contentDocument;
  if(!doc || !sel) return null;
  const all = [...doc.querySelectorAll(`.el[data-sect="${sel.sect}"][data-id="${CSS.escape(sel.id)}"]`)];
  if(!all.length) return null;
  // у строк элемент повторяется — берём самую верхнюю левую копию
  return all.reduce((a, b) => {
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    return (rb.top < ra.top - 1 || (Math.abs(rb.top - ra.top) <= 1 && rb.left < ra.left)) ? b : a;
  });
}
function boxOf(node){
  const r = node.getBoundingClientRect();
  return {x: r.left * S.zoom, y: r.top * S.zoom, w: r.width * S.zoom, h: r.height * S.zoom};
}
function drawSel(){
  const box = $('#selbox');
  const node = nodeFor(S.sel);
  if(!node){ box.style.display = 'none'; return; }
  const b = boxOf(node);
  Object.assign(box.style, {display: 'block', left: b.x + 'px', top: b.y + 'px',
                            width: b.w + 'px', height: b.h + 'px'});
  const e = selEl();
  box.innerHTML = `<span class="tag">${esc(SECT_LABEL[S.sel.sect])} · ${esc(e ? (TYPE_LABEL[e.type] || e.type) : '')}
    ${e ? `${e.w}×${e.h}` : ''}</span>` +
    ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map(h => {
      const x = h.includes('w') ? 0 : h.includes('e') ? 100 : 50;
      const y = h.includes('n') ? 0 : h.includes('s') ? 100 : 50;
      return `<div class="h" data-h="${h}" style="left:${x}%;top:${y}%"></div>`;
    }).join('');
}

// ---------- мышь на холсте ----------
function framePoint(ev){
  const r = frame.getBoundingClientRect();
  return {x: (ev.clientX - r.left) / S.zoom, y: (ev.clientY - r.top) / S.zoom};
}
function elAt(ev){
  const doc = frame.contentDocument;
  if(!doc) return null;
  const p = framePoint(ev);
  const hitEl = doc.elementsFromPoint(p.x, p.y).find(n => n.classList && n.classList.contains('el'));
  return hitEl ? {sect: hitEl.dataset.sect, id: hitEl.dataset.id, node: hitEl} : null;
}

let drag = null;
$('#hit').addEventListener('mousemove', ev => {
  if(drag) return;
  const h = elAt(ev), hv = $('#hover');
  if(!h || (S.sel && h.sect === S.sel.sect && h.id === S.sel.id)){ hv.style.display = 'none'; return; }
  const b = boxOf(h.node);
  Object.assign(hv.style, {display: 'block', left: b.x + 'px', top: b.y + 'px',
                           width: b.w + 'px', height: b.h + 'px'});
});
$('#hit').addEventListener('mouseleave', () => $('#hover').style.display = 'none');

$('#hit').addEventListener('mousedown', ev => {
  const h = elAt(ev);
  if(!h){ select(null); return; }
  select({sect: h.sect, id: h.id});
  startDrag(ev, 'move');
});
$('#selbox').addEventListener('mousedown', ev => {
  const hd = ev.target.closest('.h');
  if(hd){ ev.stopPropagation(); startDrag(ev, hd.dataset.h); }
});

function startDrag(ev, mode){
  const e = selEl();
  if(!e) return;
  ev.preventDefault();
  pushHist();
  drag = {mode, sx: ev.clientX, sy: ev.clientY, o: {x: e.x || 0, y: e.y || 0, w: e.w || 0, h: e.h || 0},
          moved: false};
}
window.addEventListener('mousemove', ev => {
  if(!drag) return;
  const e = selEl();
  if(!e) return;
  const dx = Math.round((ev.clientX - drag.sx) / S.zoom), dy = Math.round((ev.clientY - drag.sy) / S.zoom);
  if(!drag.moved && Math.abs(dx) + Math.abs(dy) < 1) return;
  drag.moved = true;
  const o = drag.o, m = drag.mode;
  if(m === 'move'){ e.x = o.x + dx; e.y = o.y + dy; }
  else{
    if(m.includes('e')) e.w = Math.max(4, o.w + dx);
    if(m.includes('s')) e.h = Math.max(4, o.h + dy);
    if(m.includes('w')){ e.w = Math.max(4, o.w - dx); e.x = o.x + (o.w - e.w); }
    if(m.includes('n')){ e.h = Math.max(4, o.h - dy); e.y = o.y + (o.h - e.h); }
  }
  applySoon();
});
window.addEventListener('mouseup', () => {
  if(!drag) return;
  if(!drag.moved) S.hist.pop();          // просто клик — в историю не пишем
  drag = null;
  drawPanels(true); markDirty();
});

function select(sel){
  S.sel = sel;
  $('#hover').style.display = 'none';
  drawSel(); drawPanels(true); drawLeft();
}

// ---------- клавиатура ----------
window.addEventListener('keydown', ev => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's'){ ev.preventDefault(); save(); return; }
  if(typing) return;
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z'){ ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y'){ ev.preventDefault(); redo(); return; }
  const e = selEl();
  if(!e) return;
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'd'){ ev.preventDefault(); duplicate(); return; }
  if(ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); removeSel(); return; }
  const step = ev.shiftKey ? 10 : 1;
  const mv = {ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step]}[ev.key];
  if(mv){ ev.preventDefault(); change(() => { e.x = (e.x || 0) + mv[0]; e.y = (e.y || 0) + mv[1]; }); }
});

// ---------- действия с элементами ----------
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2, 7); }
function addEl(sect, type){
  const {w, h} = sectSize(sect);
  const base = {id: uid(type), type, x: 10, y: Math.max(0, Math.round(h / 2) - 10),
                w: Math.min(120, w - 20), h: Math.min(20, h)};
  if(type === 'text') Object.assign(base, {text: 'Текст', font: 'text', size: 14, color: '$fg'});
  if(type === 'chip') Object.assign(base, {text: '{car_number}', fill: 'class', shape: 'slant',
                                           font: 'num', size: 13, weight: 600, italic: true,
                                           color: '#0B0E14', align: 'center', w: 36, h: 18});
  if(type === 'box') Object.assign(base, {fill: '$accent', shape: 'slant-right', w: 12, h: h, y: 0});
  if(type === 'image'){
    const img = S.assets.find(a => a.kind === 'image');
    Object.assign(base, {src: img ? img.url : '', fit: 'contain', w: 60, h: Math.min(h, 30)});
    if(!img) toast('Загрузи картинку в свойствах элемента');
  }
  change(() => elems(sect).push(base));
  select({sect, id: base.id});
}
function duplicate(){
  const e = selEl(); if(!e) return;
  const c = Object.assign(clone(e), {id: uid(e.type), x: (e.x || 0) + 6, y: (e.y || 0) + 6});
  change(() => elems(S.sel.sect).push(c));
  select({sect: S.sel.sect, id: c.id});
}
function removeSel(){
  const e = selEl(); if(!e) return;
  const list = elems(S.sel.sect);
  change(() => list.splice(list.indexOf(e), 1));
  select(null);
}
function reorder(dir){
  const e = selEl(); if(!e) return;
  const list = elems(S.sel.sect), i = list.indexOf(e), j = i + dir;
  if(j < 0 || j >= list.length) return;
  change(() => { [list[i], list[j]] = [list[j], list[i]]; });
}

// ---------- левая колонка ----------
function drawLeft(){
  const L = $('#left');
  let html = '<h4>Оверлей</h4>' + OVS.map(([id, t]) =>
    `<button class="ovbtn ${id === S.oid ? 'on' : ''}" data-ov="${id}">${esc(t)}</button>`).join('');
  if(S.spec){
    html += '<h4>Слои</h4>';
    for(const sect of sections()){
      const isSel = S.sel && S.sel.sect === sect;
      html += `<div class="sect"><div class="sh"><b class="${isSel ? 'sel' : ''}">${SECT_LABEL[sect]}</b></div>
        <div class="adds">${Object.entries(TYPE_LABEL).map(([t, l]) =>
          `<button class="add" data-add="${sect}:${t}">+ ${l}</button>`).join('')}</div>
        ${elems(sect).map(e => `<div class="it ${S.sel && S.sel.sect === sect && S.sel.id === e.id ? 'on' : ''}"
            data-pick="${sect}:${esc(e.id)}"><span class="k">${TYPE_LABEL[e.type] || e.type}</span>${
            esc(e.type === 'image' ? (e.src || '').replace(/^.*name=/, '') || 'картинка'
              : e.type === 'box' ? 'плашка' : (e.text || e.id))}</div>`).join('')}
      </div>`;
    }
  }
  L.innerHTML = html;
}
$('#left').addEventListener('click', ev => {
  const ov = ev.target.closest('[data-ov]');
  if(ov){ loadOverlay(ov.dataset.ov); return; }
  const add = ev.target.closest('[data-add]');
  if(add){ const [sect, type] = add.dataset.add.split(':'); addEl(sect, type); return; }
  const pick = ev.target.closest('[data-pick]');
  if(pick){ const i = pick.dataset.pick.indexOf(':');
    select({sect: pick.dataset.pick.slice(0, i), id: pick.dataset.pick.slice(i + 1)}); }
});

// ---------- правая колонка: свойства ----------
const opt = (list, cur) => list.map(([v, t]) =>
  `<option value="${esc(v)}" ${String(cur ?? '') === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('');
const num = (k, v, extra = '') => `<input type="number" data-k="${k}" value="${v ?? ''}" ${extra}>`;

function colorCtl(k, v){
  // цвет: из палитры ($accent...) или свой
  const pal = Object.keys(S.spec.palette || {});
  const isPal = typeof v === 'string' && v[0] === '$';
  const hex = isPal ? (S.spec.palette[v.slice(1)] || '#ffffff') : (v || '#ffffff');
  return `<div class="pair"><select data-k="${k}" data-kind="palsel">
      <option value="">свой цвет</option>${opt(pal.map(p => ['$' + p, 'палитра: ' + p]), isPal ? v : '')}
    </select><input type="color" data-k="${k}" data-kind="color" value="${/^#[0-9a-f]{6}$/i.test(hex) ? hex : '#ffffff'}"></div>`;
}
function fontCtl(k, v){
  const uploaded = (S.spec.font_faces || []).map(f => [f.family, 'загружен: ' + f.family]);
  const all = FONT_SLOTS.concat(SYS_FONTS.map(f => [f, f]), uploaded);
  const known = all.some(([x]) => x === v);
  return `<div class="pair"><select data-k="${k}">${opt(all, v)}${known || !v ? '' : `<option selected>${esc(v)}</option>`}</select></div>`;
}

let lastPanel = '';
function drawPanels(force){
  const R = $('#right');
  if(!S.spec){ R.innerHTML = ''; return; }
  const e = selEl();
  const html = e ? elementPanel(e) : overlayPanel();
  // во время перетаскивания обновляем только числа, чтобы не сбивать фокус
  if(!force && document.activeElement && R.contains(document.activeElement)) return;
  if(html === lastPanel && !force) return;
  lastPanel = html;
  R.innerHTML = html;
}

function elementPanel(e){
  const f = FIELDS[S.oid] || {};
  const flist = (f[S.sel.sect] || f.item || []).concat(f.root || []);
  let h = `<h4>${esc(SECT_LABEL[S.sel.sect])} · ${esc(TYPE_LABEL[e.type] || e.type)}</h4>
    <div class="quad">
      <div><label>X</label>${num('x', e.x)}</div><div><label>Y</label>${num('y', e.y)}</div>
      <div><label>Ширина</label>${num('w', e.w, 'min="1"')}</div><div><label>Высота</label>${num('h', e.h, 'min="1"')}</div>
    </div>`;
  if(e.type === 'text' || e.type === 'chip'){
    h += `<h4>Текст</h4>
      <textarea data-k="text" rows="2">${esc(e.text)}</textarea>
      <div class="row"><label>Вставить поле</label>
        <select data-kind="insert"><option value="">— выбрать —</option>${opt(flist, '')}</select></div>
      <div class="row"><label>Шрифт</label>${fontCtl('font', e.font)}</div>
      <div class="row"><label>Размер</label><div class="pair">${num('size', e.size, 'min="4"')}
        <select data-k="weight">${opt([['400', 'обычный'], ['500', 'средний'], ['600', 'полужирный'], ['700', 'жирный']], e.weight || 400)}</select></div></div>
      <div class="row"><label>Выравнивание</label>
        <select data-k="align">${opt([['left', 'слева'], ['center', 'по центру'], ['right', 'справа']], e.align || 'left')}</select></div>
      <div class="row"><label>Стиль</label><div class="pair">
        <label><input type="checkbox" data-k="italic" ${e.italic ? 'checked' : ''}> курсив</label>
        <label><input type="checkbox" data-k="upper" ${e.upper ? 'checked' : ''}> ЗАГЛАВНЫЕ</label></div></div>
      <div class="row"><label>Разрядка</label>${num('spacing', e.spacing || 0, 'step="0.5"')}</div>
      <div class="row"><label>Цвет текста</label>${colorCtl('color', e.color)}</div>`;
  }
  if(e.type === 'chip' || e.type === 'box'){
    const isClass = e.fill === 'class';
    h += `<h4>Фигура</h4>
      <div class="row"><label>Форма</label><select data-k="shape">${opt(SHAPES, e.shape || 'rect')}</select></div>
      <div class="row"><label>Скругление</label>${num('radius', e.radius ?? 6, 'min="0"')}</div>
      <div class="row"><label>Заливка</label><div class="pair">
        <label><input type="checkbox" data-kind="classfill" ${isClass ? 'checked' : ''}> цвет класса</label></div></div>
      ${isClass ? '' : `<div class="row"><label>Цвет заливки</label>${colorCtl('fill', e.fill)}</div>`}`;
  }
  if(e.type === 'image'){
    const imgs = S.assets.filter(a => a.kind === 'image');
    h += `<h4>Картинка</h4>
      <div class="assets">${imgs.map(a => `<div class="asset" data-src="${esc(a.url)}" title="${esc(a.name)}">
        <img src="${esc(a.url)}"></div>`).join('') || '<span class="note">Загруженных картинок нет.</span>'}</div>
      <div class="btns"><button class="sbtn" data-act="upload-image">Загрузить логотип…</button></div>
      <div class="row" style="margin-top:8px"><label>Вписать</label>
        <select data-k="fit">${opt([['contain', 'целиком'], ['cover', 'заполнить'], ['fill', 'растянуть']], e.fit || 'contain')}</select></div>`;
  }
  const leaderCol = ((e.states || {}).leader || {}).color || '';
  const pitCol = ((e.states || {}).in_pit || {}).color || '';
  h += `<h4>Поведение</h4>
    <div class="row"><label>Показывать</label><select data-k="when">${opt(WHEN, e.when || '')}${
      WHEN.some(([v]) => v === (e.when || '')) ? '' : `<option selected>${esc(e.when)}</option>`}</select></div>
    <div class="row"><label>Прозрачность</label><input type="range" min="0" max="1" step="0.05"
      data-k="opacity" value="${e.opacity ?? 1}"></div>`;
  if(e.type === 'text' || e.type === 'chip'){
    h += `<div class="row"><label>Цвет у лидера</label><div class="pair">
        <label><input type="checkbox" data-kind="state-on" data-state="leader" ${leaderCol ? 'checked' : ''}> свой</label>
        ${leaderCol ? `<input type="color" data-kind="state-color" data-state="leader" value="${/^#/.test(leaderCol) ? leaderCol : '#ff8a4c'}">` : ''}</div></div>
      <div class="row"><label>Цвет на пите</label><div class="pair">
        <label><input type="checkbox" data-kind="state-on" data-state="in_pit" ${pitCol ? 'checked' : ''}> свой</label>
        ${pitCol ? `<input type="color" data-kind="state-color" data-state="in_pit" value="${/^#/.test(pitCol) ? pitCol : '#f0a020'}">` : ''}</div></div>`;
  }
  h += `<div class="btns">

    <button class="sbtn" data-act="up">Вперёд</button>
    <button class="sbtn" data-act="down">Назад</button>
    <button class="sbtn dng" data-act="del">Удалить</button>

function overlayPanel(){
  const sp = S.spec, b = sp.body, fr = sp.frame || {};
  let h = `<h4>Оверлей</h4><div class="note">Выбери элемент на холсте, чтобы менять его. Здесь — общее.</div>`;
  if(b.type !== 'cards') h += `<div class="row"><label>Ширина</label><input type="number" data-path="width" value="${sp.width || 300}" min="40"></div>`;
  h += `<div class="row"><label>Появление</label><select data-path="enter">${opt(ENTERS, sp.enter || 'fade')}</select></div>
    <div class="row"><label>Скругление</label><input type="number" data-path="frame.radius" value="${fr.radius || 0}" min="0"></div>
    <div class="row"><label>Тень</label><label><input type="checkbox" data-path="frame.shadow" ${fr.shadow ? 'checked' : ''}> есть</label></div>
    <div class="row"><label>Полоса флага</label><input type="number" data-path="frame.flag_stripe" value="${fr.flag_stripe || 0}" min="0" title="ширина, 0 — нет"></div>`;

  h += `<h4>Шапка</h4>`;
  if(sp.header){
    h += `<div class="row"><label>Высота</label><input type="number" data-path="header.height" value="${sp.header.height}" min="4"></div>
      <div class="row"><label>Заливка</label>${colorCtlPath('header.bg.fill', (sp.header.bg || {}).fill)}</div>
      <div class="row"><label>Форма</label><select data-path="header.bg.shape">${opt(SHAPES, (sp.header.bg || {}).shape || 'rect')}</select></div>
      <div class="btns"><button class="sbtn dng" data-act="del-header">Убрать шапку</button></div>`;
  }else h += `<div class="btns"><button class="sbtn" data-act="add-header">Добавить шапку</button></div>`;

  if(b.type === 'single'){
    h += `<h4>Блок</h4><div class="row"><label>Высота</label><input type="number" data-path="body.height" value="${b.height || 100}" min="10"></div>
      <div class="row"><label>Заливка</label>${colorCtlPath('body.bg.fill', (b.bg || {}).fill)}</div>`;
  }else{
    const it = b.item;
    h += `<h4>${b.type === 'cards' ? 'Карточка' : b.type === 'grid' ? 'Ячейка' : 'Строка'}</h4>
      ${b.type === 'cards' ? `<div class="row"><label>Ширина</label><input type="number" data-path="body.item.width" value="${it.width || 200}" min="10"></div>` : ''}
      <div class="row"><label>Высота</label><input type="number" data-path="body.item.height" value="${it.height}" min="4"></div>
      <div class="row"><label>Отступ</label><input type="number" data-path="body.gap" value="${b.gap || 0}" min="0"></div>
      ${b.type === 'grid' ? `
      <div class="row"><label>Колонок</label><input type="number" data-path="body.columns" value="${b.columns || 1}" min="1" max="4"></div>
      <div class="row"><label>На странице</label><input type="number" data-path="body.page_size" value="${b.page_size || 10}" min="1"></div>
      <div class="row"><label>Секунд</label><input type="number" data-path="body.page_seconds" value="${b.page_seconds || 15}" min="3"></div>` : ''}
      <div class="row"><label>Заливка</label>${colorCtlPath('body.item.bg.fill', (it.bg || {}).fill)}</div>
      <div class="row"><label>Через одну</label>${colorCtlPath('body.item.bg.alt', (it.bg || {}).alt)}</div>
      <div class="row"><label>Форма</label><select data-path="body.item.bg.shape">${opt(SHAPES, (it.bg || {}).shape || 'rect')}</select></div>`;
    if(b.tail){
      h += `<h4>Подпись справа</h4>
        <div class="note">Видна, когда в панели задана подпись.</div>
        <div class="row"><label>Ширина</label><input type="number" data-path="body.tail.width" value="${b.tail.width || 160}" min="10"></div>
        <div class="row"><label>Заливка</label>${colorCtlPath('body.tail.bg.fill', (b.tail.bg || {}).fill)}</div>
        <div class="row"><label>Форма</label><select data-path="body.tail.bg.shape">${opt(SHAPES, (b.tail.bg || {}).shape || 'rect')}</select></div>`;
    }
  }

  h += `<h4>Подвал</h4>`;
  if(sp.footer){
    h += `<div class="row"><label>Высота</label><input type="number" data-path="footer.height" value="${sp.footer.height}" min="4"></div>
      <div class="row"><label>Заливка</label>${colorCtlPath('footer.bg.fill', (sp.footer.bg || {}).fill)}</div>
      <div class="btns"><button class="sbtn dng" data-act="del-footer">Убрать подвал</button></div>`;
  }else h += `<div class="btns"><button class="sbtn" data-act="add-footer">Добавить подвал</button></div>`;

  h += `<h4>Палитра</h4>` + Object.entries(sp.palette || {}).map(([k, v]) =>

  h += `<h4>Шрифты</h4>` + FONT_SLOTS.map(([slot, label]) => {
    const cur = (sp.fonts || {})[slot] || '';
    const first = cur.split(',')[0].replace(/'/g, '').trim();
    const uploaded = (sp.font_faces || []).map(f => [f.family, 'загружен: ' + f.family]);
    return `<div class="row"><label>${label.replace(' (слот)', '')}</label>
      <select data-slot="${slot}">${opt(SYS_FONTS.map(f => [f, f]).concat(uploaded), first)}</select></div>`;
  }).join('') +
  `<div class="assets">${(sp.font_faces || []).map(f => `<div class="asset font" title="${esc(f.src)}">${esc(f.family)}</div>`).join('')}</div>
   <div class="btns"><button class="sbtn" data-act="upload-font">Загрузить шрифт…</button></div>
   <div class="note">ttf, otf, woff, woff2. После загрузки шрифт появится во всех списках.</div>

   <h4>Сброс</h4>
   <div class="btns"><button class="sbtn dng" data-act="reset">Вернуть исходный вид</button></div>`;
  return h;
}
function colorCtlPath(path, v){
  const pal = Object.keys(S.spec.palette || {});
  const isPal = typeof v === 'string' && v[0] === '$';
  const hex = isPal ? (S.spec.palette[v.slice(1)] || '#ffffff') : (v || '#000000');
  return `<div class="pair"><select data-path="${path}" data-kind="palsel">
      <option value="">свой цвет</option>${opt(pal.map(p => ['$' + p, 'палитра: ' + p]), isPal ? v : '')}
    </select><input type="color" data-path="${path}" data-kind="color" value="${/^#[0-9a-f]{6}$/i.test(hex) ? hex : '#000000'}"></div>`;
}

// ввод в свойствах
function readVal(t){
  if(t.type === 'checkbox') return t.checked;
  if(t.type === 'number' || t.type === 'range') return t.value === '' ? undefined : +t.value;
  return t.value;
}
let typingHist = null;
$('#right').addEventListener('focusin', () => { typingHist = JSON.stringify(S.spec); });
$('#right').addEventListener('input', ev => onProp(ev, false));
$('#right').addEventListener('change', ev => onProp(ev, true));

function onProp(ev, committed){
  const t = ev.target;
  if(t.dataset.kind === 'insert'){
    if(!t.value) return;
    const e = selEl(); if(!e) return;
    change(() => { e.text = (e.text || '') + t.value; });
    return;
  }
  // запоминаем состояние до правки один раз на поле, чтобы Ctrl+Z откатывал
  // всё редактирование поля, а не каждую букву
  if(typingHist && JSON.stringify(S.spec) === typingHist){ S.hist.push(typingHist); S.fut = []; typingHist = null; }

  if(t.dataset.slot){
    const slot = t.dataset.slot, fam = t.value;
    S.spec.fonts ??= {};
    S.spec.fonts[slot] = `'${fam}','Bahnschrift','Arial Narrow',sans-serif`;
  }else if(t.dataset.path){
    let v = readVal(t);
    if(t.dataset.kind === 'palsel'){ if(!v) return; }
    setPath(S.spec, t.dataset.path, v);
  }else if(t.dataset.k){
    const e = selEl(); if(!e) return;
    let v = readVal(t);
    if(t.dataset.kind === 'palsel'){ if(!v) return; }
    if(t.dataset.k === 'when' && !v){ delete e.when; }
    else e[t.dataset.k] = v;
  }else if(t.dataset.kind === 'classfill'){
    const e = selEl(); if(!e) return;
    e.fill = t.checked ? 'class' : '$accent';
  }else if(t.dataset.kind === 'state-on'){
    const e = selEl(); if(!e) return;
    const st = t.dataset.state;
    e.states ??= {};
    if(t.checked) e.states[st] = Object.assign(e.states[st] || {}, {color: st === 'leader' ? '#FF8A4C' : '#F0A020'});
    else if(e.states[st]){ delete e.states[st].color; if(!Object.keys(e.states[st]).length) delete e.states[st]; }
  }else if(t.dataset.kind === 'state-color'){
    const e = selEl(); if(!e) return;
    e.states ??= {}; e.states[t.dataset.state] = Object.assign(e.states[t.dataset.state] || {}, {color: t.value});
  }else return;

  applyToFrame(); markDirty();
  if(committed){ drawPanels(true); drawLeft(); }
}

$('#right').addEventListener('click', async ev => {
  const a = ev.target.closest('[data-act]');
  const src = ev.target.closest('[data-src]');
  if(src){ const e = selEl(); if(e) change(() => { e.src = src.dataset.src; }); return; }
  if(!a) return;
  const act = a.dataset.act, sp = S.spec;
  if(act === 'dup') duplicate();
  if(act === 'del') removeSel();
  if(act === 'up') reorder(1);
  if(act === 'down') reorder(-1);
  if(act === 'deselect') select(null);
  if(act === 'add-header') change(() => { sp.header = {height: 28, bg: {fill: '$accent', shape: 'slant-right'}, elements: []}; });
  if(act === 'del-header') change(() => { delete sp.header; if(S.sel && S.sel.sect === 'header') S.sel = null; });
  if(act === 'add-footer') change(() => { sp.footer = {height: 24, bg: {fill: '$row'}, elements: []}; });
  if(act === 'del-footer') change(() => { delete sp.footer; if(S.sel && S.sel.sect === 'footer') S.sel = null; });
  if(act === 'upload-image') pickFile('image/*', uploadImage);
  if(act === 'upload-font') pickFile('.ttf,.otf,.woff,.woff2', uploadFont);
  if(act === 'reset'){
    if(!confirm(`Вернуть «${OVS.find(o => o[0] === S.oid)[1]}» к исходному виду? Все правки этого оверлея пропадут.`)) return;
    const r = await api('/api/broadcast/spec/reset', {id: S.oid});
    if(r.ok){ setSpec(r.spec); toast('Исходный вид восстановлен'); }
  }
});

// ---------- файлы ----------
let fileCb = null;
function pickFile(accept, cb){ const f = $('#file'); f.accept = accept; f.value = ''; fileCb = cb; f.click(); }
$('#file').addEventListener('change', () => { const f = $('#file').files[0]; if(f && fileCb) fileCb(f); });
function readB64(file){ return new Promise((ok, no) => { const r = new FileReader();
  r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); }); }
async function upload(file){
  const r = await api('/api/broadcast/asset', {name: file.name, data: await readB64(file)});
  if(!r.ok){ toast(r.message || 'Файл не принят'); return null; }
  await loadAssets();
  return r;
}
async function uploadImage(file){
  const r = await upload(file); if(!r) return;
  const e = selEl();
  if(e && e.type === 'image') change(() => { e.src = r.url; });
  toast('Картинка загружена');
}
async function uploadFont(file){
  const r = await upload(file); if(!r) return;
  const family = file.name.replace(/\.[^.]+$/, '').replace(/[^\wА-Яа-яЁё\- ]+/g, ' ').trim() || 'Custom';
  change(() => {
    S.spec.font_faces ??= [];
    if(!S.spec.font_faces.some(f => f.family === family)) S.spec.font_faces.push({family, src: r.url});
  });
  toast(`Шрифт «${family}» загружен — выбери его в списке`);
}
async function loadAssets(){ try{ S.assets = (await api('/api/broadcast/assets')).assets || []; }catch(e){} }

// ---------- загрузка и сохранение ----------
function markDirty(){
  const dirty = S.spec && JSON.stringify(S.spec) !== S.savedJson;
  const b = $('#save');
  b.textContent = dirty ? 'Сохранить' : 'Сохранено';
  b.classList.toggle('clean', !dirty);
  $('#undo').disabled = !S.hist.length; $('#redo').disabled = !S.fut.length;
  return dirty;
}
function setSpec(sp){
  delete sp.version; delete sp.id;
  S.spec = sp; S.savedJson = JSON.stringify(sp); S.hist = []; S.fut = []; S.sel = null;
  $('#ttl').textContent = 'Редактор · ' + OVS.find(o => o[0] === S.oid)[1];
  refresh();
}
async function loadOverlay(oid){
  if(S.spec && markDirty() && !confirm('Есть несохранённые правки. Перейти без сохранения?')) return;
  S.oid = oid;
  const sp = await api('/api/broadcast/spec?id=' + oid);
  frame.onload = () => { setSpec(sp); };
  frame.src = `/ov/${oid}?preview=1`;
  drawLeft();
}
async function save(){
  if(!S.spec) return;
  try{
    const r = await api('/api/broadcast/spec', {id: S.oid, spec: S.spec});
    if(r.ok){ S.savedJson = JSON.stringify(S.spec); markDirty(); toast('Сохранено — окна оверлеев обновятся за пару секунд'); }
    else toast('Не сохранилось: ' + (r.error || ''));
  }catch(e){ toast('Не сохранилось: модуль оверлеев недоступен'); }
}
window.addEventListener('beforeunload', ev => { if(markDirty()){ ev.preventDefault(); ev.returnValue = ''; } });

// ---------- верхняя панель ----------
$('#undo').onclick = undo; $('#redo').onclick = redo; $('#save').onclick = save;
$('#zoom').onchange = ev => { S.zoom = +ev.target.value; fit(); };
$('#demo').onclick = async () => {
  S.demo = !S.demo;
  await api('/api/demo', {on: S.demo});
  $('#demo').classList.toggle('on', S.demo);
  toast(S.demo ? 'Демо-данные включены' : 'Демо-данные выключены');
};
$('#air').onclick = async () => {
  S.air = !S.air;
  await api('/api/broadcast/visibility', {id: S.oid, visible: S.air});
  $('#air').classList.toggle('on', S.air);
  toast(S.air ? 'Оверлей в эфире — сохрани, чтобы окно показало правки' : 'Оверлей убран');
};
async function syncTop(){
  try{
    const st = await api('/api/state');
    S.demo = !!st.demo; $('#demo').classList.toggle('on', S.demo);
    const v = await api('/api/broadcast/visibility');
    S.air = !!(v.overlays.find(o => o.id === S.oid) || {}).visible;
    $('#air').classList.toggle('on', S.air);
    $('#status').textContent = st.connected ? (st.demo ? 'демо-гонка' : st.track || 'сессия') : 'сим не подключён — включи демо';
  }catch(e){}
}

loadAssets();
loadOverlay(new URLSearchParams(location.search).get('ov') || 'tower');
syncTop(); setInterval(syncTop, 3000);
</script>
</body>
</html>
