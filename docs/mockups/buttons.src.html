<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iRC — кнопки</title>
<style>
@font-face{font-family:'Exo 2';src:url(data:font/ttf;base64,__EXO__) format('truetype');font-weight:100 900}
@font-face{font-family:'Roboto Mono';src:url(data:font/ttf;base64,__MONO__) format('truetype');font-weight:100 700}
:root{--acc:#FF5A1F;--fg:#EAEEF5;--dim:#8E8E98;--up:#2FD16A;--dn:#FF4D4D}
*{box-sizing:border-box}
body{margin:0;background:#0b0c10;color:var(--fg);font:14px 'Exo 2',system-ui,sans-serif;padding:22px 16px 40px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:19px;margin:0 0 4px;letter-spacing:.04em}
p.sub{color:var(--dim);font-size:13px;margin:0 0 18px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(580px,1fr));gap:14px}
/* панель F */
.p{background:linear-gradient(180deg,#19161b 0%,#13151a 45%,#121419 100%);border:1px solid rgba(255,255,255,.07);border-radius:7px;box-shadow:0 8px 22px rgba(0,0,0,.4);overflow:hidden}
.ph{position:relative;padding:10px 14px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
.ph::before{content:"";position:absolute;left:0;top:10px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.ph b{font:800 13px 'Exo 2';letter-spacing:.08em;text-transform:uppercase}
.ph span{color:var(--dim);font-size:12px;margin-left:10px}
.pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab{font:800 9px 'Exo 2';letter-spacing:.18em;text-transform:uppercase;color:#6b707b;width:100%;margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hvn{font:700 9px 'Roboto Mono';color:#6b707b;margin-left:4px}
/* общая основа кнопок */
.b{font:800 10.5px 'Exo 2';letter-spacing:.14em;text-transform:uppercase;color:var(--fg);height:30px;padding:0 13px;display:inline-flex;align-items:center;justify-content:space-between;gap:10px;white-space:nowrap;border:0;cursor:pointer;position:relative}
.b kbd{font:700 9px 'Roboto Mono';letter-spacing:.04em}
.seg{display:inline-flex;overflow:hidden}
.seg .b{justify-content:center;padding:0 14px}

/* 1 · сейчас */
.v1 .b{background:#1a1d24;border:1px solid #2e3440;border-radius:5px}
.v1 .b kbd{color:var(--dim);border:1px solid #39404c;border-radius:3px;padding:1px 4px}
.v1 .b.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.v1 .b.pri kbd{color:#fff;border-color:rgba(255,255,255,.5)}
.v1 .seg{border:1px solid #39404c;border-radius:5px}
.v1 .seg .b{border:0;border-radius:0;background:transparent;color:var(--dim)}
.v1 .seg .b.on{background:var(--up);color:#04140a}

/* 2 · без рамки, свечение */
.v2 .b{background:#1d212a;border-radius:5px;transition:.15s}
.v2 .b kbd{color:#7d838e;background:rgba(255,255,255,.05);border-radius:3px;padding:2px 5px}
.v2 .b.hv{background:#252b36;box-shadow:0 0 14px rgba(255,90,31,.30)}
.v2 .b.pri{background:var(--acc);color:#fff;box-shadow:0 0 16px rgba(255,90,31,.55),0 0 3px rgba(255,90,31,.9)}
.v2 .b.pri kbd{color:#fff;background:rgba(0,0,0,.18)}
.v2 .b.st-on kbd{color:var(--up);background:rgba(47,209,106,.12)}
.v2 .seg{background:#161a21;border-radius:5px}
.v2 .seg .b{background:transparent;color:var(--dim);border-radius:5px}
.v2 .seg .b.on{background:var(--up);color:#04140a;box-shadow:0 0 12px rgba(47,209,106,.55)}

/* 3 · контур оранжевым */
.v3 .b{background:rgba(255,90,31,.03);border:1px solid rgba(255,90,31,.28);border-radius:5px}
.v3 .b kbd{color:#b98a78}
.v3 .b.hv{border-color:rgba(255,90,31,.75);box-shadow:0 0 12px rgba(255,90,31,.35),inset 0 0 10px rgba(255,90,31,.12)}
.v3 .b.pri{background:rgba(255,90,31,.16);border-color:var(--acc);color:#fff;box-shadow:0 0 14px rgba(255,90,31,.45),inset 0 0 12px rgba(255,90,31,.2)}
.v3 .b.st-on kbd{color:var(--up)}
.v3 .seg{border:1px solid rgba(47,209,106,.35);border-radius:5px}
.v3 .seg .b{border:0;border-radius:0;background:transparent;color:var(--dim)}
.v3 .seg .b.on{background:rgba(47,209,106,.18);color:var(--up);box-shadow:inset 0 0 10px rgba(47,209,106,.25)}

/* 4 · световая кромка снизу (как вкладки меню) */
.v4 .b{background:#1a1d24;border-radius:5px 5px 2px 2px;box-shadow:inset 0 -2px 0 #2e3440}
.v4 .b kbd{color:var(--dim)}
.v4 .b.hv{box-shadow:inset 0 -2px 0 var(--acc),0 6px 12px -6px rgba(255,90,31,.6)}
.v4 .b.st-on{box-shadow:inset 0 -2px 0 var(--up)}
.v4 .b.st-on kbd{color:var(--up)}
.v4 .b.pri{background:linear-gradient(180deg,#2a1d19,#22171a);color:#fff;box-shadow:inset 0 -3px 0 var(--acc),0 8px 16px -6px rgba(255,90,31,.75)}
.v4 .b.pri kbd{color:var(--acc)}
.v4 .seg{background:#1a1d24;border-radius:5px 5px 2px 2px}
.v4 .seg .b{background:transparent;color:var(--dim);box-shadow:inset 0 -2px 0 #2e3440;border-radius:0}
.v4 .seg .b.on{color:#fff;box-shadow:inset 0 -2px 0 var(--up),0 6px 12px -6px rgba(47,209,106,.7)}

/* 5 · тёплый градиент, как панели */
.v5 .b{background:linear-gradient(180deg,#2a2226,#1b1a1f);border-radius:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 6px rgba(0,0,0,.4)}
.v5 .b kbd{color:#9a8f93}
.v5 .b.hv{background:linear-gradient(180deg,#352a2c,#211e23);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 14px rgba(255,90,31,.25)}
.v5 .b.pri{background:linear-gradient(180deg,#FF7340,#E2470F);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 16px rgba(255,90,31,.5)}
.v5 .b.pri kbd{color:#fff}
.v5 .b.st-on kbd{color:var(--up)}
.v5 .seg{border-radius:5px;background:#141418;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.v5 .seg .b{background:transparent;box-shadow:none;color:var(--dim)}
.v5 .seg .b.on{background:linear-gradient(180deg,#46d97f,#24b85b);color:#04140a;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 12px rgba(47,209,106,.45)}

/* 6 · скошенные, как плашка номера */
.v6 .b{background:#1d212a;border-radius:3px;transform:skewX(-12deg);margin:0 3px}
.v6 .b>*{transform:skewX(12deg)}
.v6 .b kbd{color:var(--dim)}
.v6 .b.hv{background:#262c38;box-shadow:0 0 14px rgba(255,90,31,.3)}
.v6 .b.pri{background:var(--acc);color:#fff;box-shadow:0 0 16px rgba(255,90,31,.5)}
.v6 .b.pri kbd{color:#fff}
.v6 .b.st-on kbd{color:var(--up)}
.v6 .seg{transform:skewX(-12deg);border-radius:3px;background:#161a21;margin:0 3px}
.v6 .seg .b{transform:none;margin:0;background:transparent;color:var(--dim);border-radius:0}
.v6 .seg .b>*{transform:skewX(12deg)}
.v6 .seg .b.on{background:var(--up);color:#04140a}
.v6 .b span,.v6 .b kbd{display:inline-block}

/* 7 · переключатель-ползунок и точки состояния */
.v7 .b{background:#1d212a;border-radius:5px}
.v7 .b.hv{background:#252b36;box-shadow:0 0 14px rgba(255,90,31,.3)}
.v7 .b.pri{background:var(--acc);color:#fff;box-shadow:0 0 16px rgba(255,90,31,.5)}
.v7 .b kbd{display:inline-flex;align-items:center;gap:6px;color:var(--dim)}
.v7 .b kbd::before{content:"";width:7px;height:7px;border-radius:50%;background:#4a505b}
.v7 .b.st-on kbd{color:var(--up)}
.v7 .b.st-on kbd::before{background:var(--up);box-shadow:0 0 8px var(--up)}
.v7 .b.pri kbd::before{display:none}
.v7 .b.pri kbd{color:#fff}
.sw{display:inline-flex;align-items:center;gap:10px;font:800 10.5px 'Exo 2';letter-spacing:.14em;text-transform:uppercase;color:var(--up)}
.sw i{width:40px;height:22px;border-radius:11px;background:rgba(47,209,106,.25);position:relative;box-shadow:inset 0 0 0 1px rgba(47,209,106,.55),0 0 12px rgba(47,209,106,.35)}
.sw i::after{content:"";position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.sw.off{color:var(--dim)} .sw.off i{background:#1d212a;box-shadow:inset 0 0 0 1px #343a45}
.sw.off i::after{left:3px;right:auto;background:#59606b;box-shadow:none}

/* 8 · спокойные, акцент только у главной */
.v8 .b{background:transparent;color:#C3C9D3;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.v8 .b kbd{color:#6b707b}
.v8 .b.hv{background:rgba(255,255,255,.04);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,90,31,.5),0 0 12px rgba(255,90,31,.2)}
.v8 .b.pri{background:var(--acc);color:#fff;box-shadow:0 0 16px rgba(255,90,31,.5)}
.v8 .b.pri kbd{color:rgba(255,255,255,.85)}
.v8 .b.st-on kbd{color:var(--up)}
.v8 .seg{border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.v8 .seg .b{box-shadow:none;color:var(--dim)}
.v8 .seg .b.on{background:rgba(47,209,106,.14);color:var(--up)}
</style></head><body><div class="wrap">
<h1>Кнопки — варианты в стиле F</h1>
<p class="sub">Натуральный размер, на панели стиля F. В каждом варианте: переключатель модуля, «Открыть», кнопки действий с состоянием, главная кнопка и «Проверить». Кнопка с пометкой «наведение» — как она выглядит под мышью.</p>
<div class="grid" id="g"></div></div>
<script>
const V = [
  ['1 · сейчас', 'серая рамка, заливка без свечения'],
  ['2 · без рамки, свечение', 'тёмная заливка, мягкий оранжевый ореол при наведении; «Вкл» светится'],
  ['3 · контур оранжевым', 'тонкая оранжевая рамка, при наведении разгорается; главная — светящийся контур'],
  ['4 · световая кромка', 'как вкладки меню: состояние — цветная полоса снизу'],
  ['5 · тёплый градиент', 'объём как у панелей: блик сверху, главная — оранжевый градиент'],
  ['6 · скошенные', 'наклон как у номера на плашке — гоночный характер'],
  ['7 · ползунок и точки', 'модуль — переключатель-ползунок, состояние действий — светящаяся точка'],
  ['8 · спокойные', 'почти прозрачные, акцент только у главной кнопки'],
];
const seg = (n) => n === 7
  ? `<span class="sw"><i></i>Вкл</span><span class="sw off"><i></i>Выкл</span>`
  : `<span class="seg"><button class="b on"><span>Вкл</span></button><button class="b"><span>Выкл</span></button></span>`;
document.getElementById('g').innerHTML = V.map(([t, d], i) => {
  const n = i + 1;
  return `<section class="p v${n}"><div class="ph"><b>${t}</b><span>${d}</span></div><div class="pb">
    <div class="lab">Модуль</div>
    <div class="row" style="justify-content:space-between">${seg(n)}<span class="row"><button class="b"><span>Открыть</span></button><button class="b hv"><span>Открыть</span></button><span class="hvn">← наведение</span></span></div>
    <div class="lab">Действия</div>
    <div class="g2">
      <button class="b st-on"><span>Рейс-контроль поверх сима</span><kbd>показан</kbd></button>
      <button class="b"><span>Пульт поверх сима</span><kbd>скрыт</kbd></button>
      <button class="b hv"><span>Редактор трансляции</span><kbd>5</kbd></button>
      <button class="b pri"><span>Включить всё к гонке</span><kbd>F9</kbd></button></div>
    <div class="row" style="justify-content:space-between;border-top:1px solid rgba(255,255,255,.06);padding-top:10px">
      <span><div class="lab" style="margin:0">Обновления</div><span style="color:var(--dim);font-size:12px">установлена 2.54.4 · проверка раз в час</span></span>
      <button class="b"><span>Проверить</span></button></div>
  </div></section>`; }).join('');
</script></body></html>
